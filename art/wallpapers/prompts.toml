# PengyOS desktop wallpaper candidates — prompt manifest
#
# Provenance record for the 20 candidate backgrounds drawn on 2026-10-06. Each
# entry is the *exact* scene text handed to the generator; the shared style
# block lives in generate.sh so every candidate keeps one mascot and one look.
#
# Palette anchors are COSMIC's own accent swatches (the Appearance → Accent
# colour row), read from libcosmic cosmic-theme/src/model/light.ron:
#
#   accent_blue      #00525A   accent_yellow   #534800
#   accent_indigo    #2E496D   accent_green    #185529  (PengyOS default)
#   accent_purple    #68217C   accent_orange   #624000
#   accent_pink      #86043A   accent_red      #78292E
#   accent_warm_grey #554742
#   ext_blue #6ACAD8  ext_purple #D58CFF  ext_pink #FF9CDD  ext_indigo #95C4FC
#   ext_orange #FBB86C  ext_yellow #F7E062  ext_warm_grey #9B8E8A
#
# Generated with the image_gen skill (gemini-3.1-flash-image), --ar 16:9 --res 2K.

[meta]
aspect_ratio = "16:9"
resolution = "2K"
model = "gemini-3.1-flash-image"
generated = "2026-10-06"

# ---------------------------------------------------------------- seasons ----

[[wallpaper]]
name = "spring-thaw"
caption = "Spring: first crocuses through the last of the snow."
palette = ["#185529", "#95C4FC", "#FF9CDD"]
