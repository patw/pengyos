# PengyOS default: one zstd-compressed swap device in RAM, as Fedora ships it.
# zram-size is the most *uncompressed* data it may hold; with zstd's ~3:1 on
# typical memory it costs at most about a third of that in real RAM.
# Override in /etc/systemd/zram-generator.conf.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
