# PengyOS: the default boot splash theme (package/plymouth/pengyos-theme).
[Daemon]
Theme=pengyos
ShowDelay=0
DeviceTimeout=8
# Draw on simpledrm (the firmware framebuffer) instead of waiting for the GPU
# driver: with no initramfs, nvidia-drm only comes up after Plymouth starts, so
# by default the splash appeared ~2 s before greetd took over, or not at all
# (ASUS PRIME Z790-P + RTX 3060 Ti, 2026-10-04). Plymouth still skips simpledrm
# at 640x480/800x600/1024x768 firmware modes.
UseSimpledrm=1
