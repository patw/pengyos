# nvidia-open: module configuration for the NVIDIA edition.

# nouveau matches the same PCI ids; the proprietary driver owns the GPU here.
# (udev loads nvidia-drm, and through it nvidia + nvidia-modeset, by modalias.)
blacklist nouveau
options nouveau modeset=0

# Atomic KMS + a DRM fbdev (takes over the console from simpledrm). Both are the
# 595 defaults; stated so a future default change cannot silently break Wayland.
options nvidia-drm modeset=1 fbdev=1
