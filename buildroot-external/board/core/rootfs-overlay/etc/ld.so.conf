# Extra library directories for the dynamic loader. The image's own libraries
# are in /usr/lib and need no entry. To add a directory (a vendor SDK under
# /opt, a library copied in as a stopgap until the next image ships it), drop a
# file into /etc/ld.so.conf.d/NAME.conf with one directory per line, then run
# `sudo ldconfig -X`. pengyos-ldconfig.service rebuilds the cache at every boot,
# so it always matches the slot that booted (an update or a rollback swaps
# /usr underneath it). Delete the .conf once the image ships the library: an
# entry here wins over /usr/lib.
include /etc/ld.so.conf.d/*.conf
