# Super-I/O sensor drivers for desktop motherboards.
#
# None of these can be auto-loaded: they have no MODULE_DEVICE_TABLE and find
# their chip by probing I/O ports 0x2e/0x4e inside module_init, so udev has no
# device to match. On other distributions `sensors-detect` writes this file for
# you; PengyOS ships lm-sensors but never runs sensors-detect (it is interactive,
# needs root and writes configuration), so the image ships the answer instead.
#
# Loading is harmless where there is no chip: each driver returns -ENODEV and
# nothing binds (one log line, no device). On a board that does have one, this is
# the difference between "CPU and NVMe only" and the full fan/voltage/board
# temperature set - measured on behopc (NCT6798D), behoserver (NCT6798D) and
# behotv (NCT6797D): +34 to +43 sensors each.
#
# asus_ec_sensors / asus_wmi_sensors are deliberately absent: they are ACPI
# devices and udev loads them on the boards that have them.
nct6775
it87
f71882fg
w83627ehf
