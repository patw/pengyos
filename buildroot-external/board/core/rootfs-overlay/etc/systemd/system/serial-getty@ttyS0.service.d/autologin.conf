# PengyOS Core — autologin on the serial console (ttyS0).
#
# Replaces the old template-wide getty@.service.d/autologin.conf (which was a
# no-op for the serial unit — getty@.service and serial-getty@.service are
# different units — and also hardcoded ttyS0, so it would have hijacked tty1).
# Instance-specific, and mirrors systemd's own serial-getty@ ExecStart + -a root.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --noreset --noclear -a root --keep-baud 115200,57600,38400,9600 - ${TERM}
