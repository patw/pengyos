# PengyOS Core — autologin on the local video console (tty1).
#
# Instance-specific drop-in (getty@tty1.service.d/) so it only affects the
# physical console; the serial console has its own drop-in under
# serial-getty@ttyS0.service.d/. Adds agetty's -a root so the single-session
# node drops straight to a root shell on screen. The default ExecStart must be
# cleared first (an override that adds to ExecStart would run two gettys).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --noreset --noclear -a root --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d - ${TERM}
