# "Online" means one link is up, not every link networkd manages. By default
# wait-online waits for all of them, so a machine with an unplugged port (a
# laptop on Wi-Fi with its Ethernet port empty, a box with a second NIC) sat at
# boot for wait-online's 2-minute timeout, and sshd (After=network-online.target)
# came up two minutes late. Found on a ThinkPad Server install, 2026-10-30.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
