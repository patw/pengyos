# PengyOS: bound what crash dumps can take on the data partition. systemd's
# defaults allow 10% of the filesystem (up to 4G) and dumps of up to 32G; a
# Steam or browser crash alone can be gigabytes, and a default that fills a
# user's disk is exactly what the backup timer did (26.10.31).
#   MaxUse:   the store is trimmed to 1G, oldest dumps first (the newest one
#             is always kept, even when it alone is bigger)
#   KeepFree: and never leaves the filesystem with less than 10G free
#
# ProcessSizeMax is left at systemd's default (32G) on purpose. Until 26.11.16 it
# was 2G, meant as "don't store big dumps". It did the opposite: a dump bigger than
# ProcessSizeMax is still stored, but systemd skips its stack trace. A 12.6 GB C++
# service crashed on behotv on 2026-11-12, and the journal said only "dumped core";
# the cause had to be dug out of the core by hand. The stack trace in the journal
# (coredumpctl info) is the most useful thing a crash leaves, so every crash gets one.
[Coredump]
MaxUse=1G
KeepFree=10G
