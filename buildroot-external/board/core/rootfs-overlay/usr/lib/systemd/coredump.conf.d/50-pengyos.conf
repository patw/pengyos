# PengyOS: bound what crash dumps can take on the data partition. systemd's
# defaults allow 10% of the filesystem (up to 4G) and dumps of up to 32G; a
# Steam or browser crash alone can be gigabytes, and a default that fills a
# user's disk is exactly what the backup timer did (26.10.31).
#   MaxUse:         the whole store never exceeds 1G (oldest dumps go first)
#   KeepFree:       and never leaves the filesystem with less than 10G free
#   ProcessSizeMax: a bigger process is not stored; its backtrace still goes
#                   to the journal
[Coredump]
MaxUse=1G
KeepFree=10G
ProcessSizeMax=2G
