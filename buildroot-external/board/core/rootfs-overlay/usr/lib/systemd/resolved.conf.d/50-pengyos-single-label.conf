# PengyOS (every edition): send single-label names ("miniserv", "behopc") to the
# link's DNS server too. A home router's DNS knows every DHCP client by its bare
# name, and resolved's default (no) tried such names only over LLMNR, which
# nothing on a home LAN answers: `ssh miniserv` failed with NXDOMAIN while
# `nslookup miniserv <router>` worked (behoserver, 26.10.52). With no LAN DNS
# server a bare name reaches the fallback servers and comes back NXDOMAIN.
[Resolve]
ResolveUnicastSingleLabel=yes
