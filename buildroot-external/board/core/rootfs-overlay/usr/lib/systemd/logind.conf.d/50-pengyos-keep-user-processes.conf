# PengyOS: leave a user's processes running when their login session ends.
# Buildroot builds systemd with meson's default-kill-user-processes=true, so
# logind killed everything in a session's scope on logout: a tmux/screen/nohup
# job started over ssh died with the ssh connection. Fedora, Debian and Arch all
# ship "no"; a user who wants the stricter behaviour can set it in
# /etc/systemd/logind.conf.d/.
[Login]
KillUserProcesses=no
