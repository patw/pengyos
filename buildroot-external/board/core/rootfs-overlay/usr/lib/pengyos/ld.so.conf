# /etc/ld.so.conf, linked there at boot (/usr/lib/tmpfiles.d/pengyos-usrlocal.conf):
# Buildroot refuses an /etc/ld.so.conf (and .d) in the image, and from here it follows
# the image. Replace the link with a file of your own only if you must; it then
# stops following the image.
#
# Extra library directories for the dynamic loader. The image's own libraries
# are in /usr/lib and need no entry. For a library the image does not ship (yet):
#   - drop it into /usr/local/lib (on data, kept across updates), or
#   - list another directory (a vendor SDK under /opt, say) in
#     /etc/ld.so.conf.d/NAME.conf, one per line;
# then run `sudo ldconfig -X`. pengyos-ldconfig.service rebuilds the cache at
# every boot, so it always matches the slot that booted (an update or a rollback
# swaps /usr underneath it). Remove the stopgap once the image ships the
# library: these directories win over /usr/lib.
/usr/local/lib
include /etc/ld.so.conf.d/*.conf
