# OpenSSL's compiled-in default CA file is /etc/ssl/cert.pem; the bundle is
# /etc/ssl/certs/ca-certificates.crt. Without the link, code that asks OpenSSL
# for its default file (Python's ssl.get_default_verify_paths().cafile) got
# None. A link made here, not shipped in the overlay: the repo ignores *.pem.
# L, not L+: a file the operator put there is kept.
L /etc/ssl/cert.pem - - - - certs/ca-certificates.crt
