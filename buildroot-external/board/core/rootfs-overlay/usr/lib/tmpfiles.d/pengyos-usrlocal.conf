# /usr/local -> /var/usrlocal (board/core/post-build.sh): the machine's own
# programs, libraries and firmware, kept on data across image updates.
d /var/usrlocal              0755 root root -
d /var/usrlocal/bin          0755 root root -
d /var/usrlocal/lib          0755 root root -
d /var/usrlocal/lib/firmware 0755 root root -
d /var/usrlocal/share        0755 root root -

# The loader config (lists /usr/local/lib and /etc/ld.so.conf.d/*.conf): a link,
# so it follows the image. Buildroot refuses both /etc/ld.so.conf and
# /etc/ld.so.conf.d in the image itself, so they are made here.
L /etc/ld.so.conf   - - - - /usr/lib/pengyos/ld.so.conf
d /etc/ld.so.conf.d 0755 root root -
