# Unprivileged perf events, for the Hardware Monitor app.
#
# The kernel defaults this to 2, which lets a process profile only itself. The
# monitor reads system-wide counters (perf_event_open with pid=-1) for two
# things it cannot get anywhere else:
#
#   * APERF/MPERF effective clocks - what the cores actually delivered, as
#     opposed to what they were asked for (cpufreq shows the latter);
#   * CPU package and core-domain energy, when RAPL's energy_uj is not readable
#     (it is mode 0400 root and no udev rule widens it).
#
# Without this the app still works, it is simply missing those rows.
#
# What it costs, stated plainly: 0 means any local user can read system-wide
# performance counters, which is a side channel against other processes. That is
# an accepted trade here - this is a machine its owner sits at, the alternative
# is a monitor that cannot show CPU power, and 2 is not a security boundary
# anybody should be relying on for isolation (sandboxing, namespaces and
# separate users are).
#
# Every edition, because the Server TUI monitor wants the same rows.
kernel.perf_event_paranoid = 0
