# PengyOS: room for programs that map many regions. The kernel default (65530)
# makes Steam/Proton games (Counter-Strike 2, DayZ, Hogwarts Legacy, ...) crash
# with mmap failures and is below what Elasticsearch/OpenSearch require. Ubuntu
# and Arch ship 1048576 (Fedora 2147483642). Override in /etc/sysctl.d/.
vm.max_map_count = 1048576
