# PengyOS Server — bootable USB/disk image (GPT + EFI System Partition + ext4 root).
# Assembled by post-image.sh via genimage. UUID_TMP is substituted with the real
# rootfs PARTUUID so the kernel can find root by PARTUUID (stable across USB
# ports); DISK_UUID_TMP, BOOT_UUID_TMP and ESP_ID_TMP (the FAT volume serial)
# with IDs derived from it, so a rebuild of the same commit gives the same
# image (board/common/image-ids.sh).

image efi-part.vfat {
	vfat {
		# -F 32 forces FAT32: mkfs.fat's auto-selection makes this 64 MiB
		# volume FAT16, and some firmware (Lenovo ThinkPad L14 Gen 1 AMD)
		# refuses to boot a FAT16 ESP — the machine resets before GRUB.
		# Every other ESP we build (installer payload, pengyos-installer,
		# pengyos-media) is FAT32.
		extraargs = "-i ESP_ID_TMP -F 32"
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
	}

	size = 64M
}

image pengyos-server-x86_64.img {
	hdimage {
		partition-table-type = "hybrid"
		disk-uuid = DISK_UUID_TMP
		disk-signature = 0x50454e47
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = BOOT_UUID_TMP
		partition-type = 0xEF
		# 1 MiB alignment (matches pengyos-installer and the Ubuntu ESP).
		offset = 1M
		bootable = true
	}

	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = UUID_TMP
		image = "rootfs.ext2"
	}
}
