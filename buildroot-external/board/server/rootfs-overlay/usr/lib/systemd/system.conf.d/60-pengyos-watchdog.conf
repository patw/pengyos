# PengyOS Server (and every edition built on it) — a hardware watchdog.
#
# systemd pets the board's watchdog (iTCO_wdt on Intel, sp5100_tco on AMD,
# loaded by udev when the board has one; systemd opens the device when it
# appears). If PID 1 wedges, the machine restarts by itself instead of waiting
# for someone to power-cycle it. That matters most during an update's trial
# boot: a restart there goes back to the previous system. No watchdog
# device, no effect. The shutdown watchdog keeps systemd's default (10 min).
[Manager]
RuntimeWatchdogSec=60s
