# Locked memory: no limit (Server layer; Desktop inherits it).
#
# systemd's default is 8 MiB. GPU inference containers lock their weights and
# GPU buffers (ROCm, CUDA, RDMA) and run with `--ulimit memlock=-1`, which a
# rootless container cannot raise above its user's hard limit: on 8 MiB they fail
# to start or fall back to slow pageable copies (gufo, halogen on Strix Halo,
# 2026-11-04). Every service and login session inherits this, including user@.service,
# so a user's Quadlets do too. Locked memory still counts against the cgroup's
# MemoryMax=, so it is not a way around a memory limit.
[Manager]
DefaultLimitMEMLOCK=infinity
