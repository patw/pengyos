# PengyOS Server: closing a laptop's lid does nothing. A laptop server runs with
# its lid shut in a corner; logind's default (suspend on lid close) put it to
# sleep and off the network. The Desktop ships its own copy of this file that
# keeps suspend on close. To change it here, use /etc/systemd/logind.conf.d/.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
