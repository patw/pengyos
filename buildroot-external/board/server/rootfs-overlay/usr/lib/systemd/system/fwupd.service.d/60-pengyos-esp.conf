# PengyOS: where the EFI System Partition is (Server, and the Desktop on top).
#
# fwupd finds the ESP through UDisks2, which the Server does not ship, so
# capsule updates (system firmware) and the dbx update (which first checks the
# ESP's boot binaries against the new revocation list) failed with "no ESP".
# The installer mounts the ESP at /efi on every PengyOS machine
# (pengyos-install: x-systemd.automount, so the first access mounts it), and
# fwupd's unit already has /efi/EFI in ReadWritePaths=. FWUPD_UEFI_ESP_PATH
# makes fwupd use that mount instead of asking UDisks for volumes.
# Check: `fwupdtool esp-list` names /efi.
[Service]
Environment=FWUPD_UEFI_ESP_PATH=/efi
