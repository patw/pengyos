# PengyOS Server: unblock Wi-Fi before joining the network.
#
# This unit runs only on a machine the installer (or its owner) set up to use
# Wi-Fi, so a soft block here is never wanted: it is an Fn key pressed by
# accident, or a block a ThinkPad/IdeaPad keeps in its embedded controller
# across reboots. On a lid-shut laptop-server (US-SRV-12) whose only link is
# Wi-Fi, that made it unreachable, and `rfkill` over SSH cannot help a machine
# you cannot reach. With this, a power cycle brings it back. A hardware switch
# (a hard block) cannot be undone from software; `rfkill` shows which it is.
# The leading "-": a machine without rfkill support still starts the supplicant.
[Service]
ExecStartPre=-/usr/bin/rfkill unblock wifi
