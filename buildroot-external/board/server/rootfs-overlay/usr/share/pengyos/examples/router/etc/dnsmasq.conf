# Example: a router's DHCP + DNS. Then: sudo systemctl enable --now dnsmasq
#
# Listen on the LAN and the VPN only, by address. bind-dynamic is required
# next to systemd-resolved (its stub holds 127.0.0.53:53) and copes with wg0
# coming up after dnsmasq.
interface=lan0
interface=wg0
bind-dynamic

# Upstream DNS: only these, not /etc/resolv.conf or /etc/hosts.
no-resolv
no-hosts
server=94.140.14.14
server=94.140.15.15
domain-needed
bogus-priv
cache-size=1000

# Names: hosts that take a lease are <name>.lan.example
domain=lan.example
expand-hosts

# DHCPv4 pool and reservations
dhcp-range=192.168.50.100,192.168.50.200,24h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
dhcp-authoritative
#dhcp-host=00:00:00:00:00:10,192.168.50.10,server

# IPv6: router advertisements for the /64 networkd delegated to lan0, SLAAC,
# and DNS names for hosts from their SLAAC addresses (ra-names).
dhcp-range=::,constructor:lan0,ra-names,slaac,64,24h
