# PengyOS: a quadlet container's output goes to its unit's journal (2026-11-12).
#
# /etc/containers/containers.conf sets log_driver = "k8s-file" for every
# container (distrobox needs `podman logs`). For a quadlet that put stdout and
# stderr in a file inside the container's own directory, which `--rm` deletes when
# the container exits, so a crashed service's last words (a C++ abort message, a
# Python traceback) were gone. "passthrough" hands them to systemd instead:
#   journalctl -u NAME            (system lane)
#   journalctl --user -u NAME     (user lane)
# `podman logs` does not work for these containers; journalctl replaces it.
#
# To use another driver for one unit, put it in NAME.container.d/50-log.conf; to
# drop this default, create an empty file with this name in your own quadlet dir.
[Container]
LogDriver=passthrough
