# PengyOS updates — read by pengyos-update.
#
#   pengyos-update check              is there a newer release?
#   sudo pengyos-update apply         install it (into the other system slot)
#   sudo pengyos-update channel NAME  switch channel (writes this file)
#
# Releases are announced in the feed and checked against the signing keys in
# /usr/share/pengyos/keys before anything is written.
feed = https://pengyos.catbee.ca/update/feed.xml
# stable: tested releases. testing: new releases first (also gets stable ones).
channel = stable
