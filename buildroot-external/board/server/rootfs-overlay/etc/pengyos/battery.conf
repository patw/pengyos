# pengyos-battery-limit: charge a laptop's battery up to LIMIT percent, then stop.
# A laptop server is always plugged in; holding the battery at 100% wears it out
# and can make it swell. 80 is a common compromise; 60 is gentler still.
# LIMIT=100 charges to full again. Apply a change with:
#   sudo systemctl restart pengyos-battery-limit
LIMIT=80

# pengyos-battery-shutdown: power off cleanly when the machine runs on battery
# alone and the charge (all batteries together) falls to SHUTDOWN_AT percent, so
# a power cut or a pulled plug never ends in the battery dying mid-write. A
# number from 1 to 50, or off. Apply a change with:
#   sudo systemctl restart pengyos-battery-shutdown
SHUTDOWN_AT=5
