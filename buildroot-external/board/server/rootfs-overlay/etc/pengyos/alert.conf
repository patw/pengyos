# ============================================================================
# PengyOS — where alerts go (/etc/pengyos/alert.conf), read by pengyos-alert
# ----------------------------------------------------------------------------
# What alerts: smartd (a disk failing or too hot), pengyos-backup,
# pengyos-update-check and pengyos-monitor failing (their OnFailure=), and a
# disk filling past DISK_ALERT_PCT (/etc/pengyos/monitor.conf). Any unit of
# your own can join with `OnFailure=pengyos-alert@%n.service` in its [Unit].
#
# Set at least one transport, then check it: sudo pengyos-alert test
# Everything is also written to the journal: journalctl -t pengyos-alert
#
# Secrets (NTFY_TOKEN=, SMTP_PASSWORD=) do NOT go here: put them in
# /etc/pengyos/alert.cred, root-only:
#   sudo install -m 600 /dev/null /etc/pengyos/alert.cred && sudoedit /etc/pengyos/alert.cred
# ============================================================================

# ntfy: a push to a phone (the ntfy app, subscribed to the same topic). A
# public ntfy.sh topic is readable by anyone who guesses its name: pick a long
# random one, or use your own server (and NTFY_TOKEN= in alert.cred).
#NTFY_URL=https://ntfy.sh/pengyos-CHANGE-ME-to-something-long-and-random

# Mail through an SMTP server you have an account on (or a LAN relay).
#MAIL_TO=you@example.com
#MAIL_FROM=pengyos-alert@this-host
#SMTP_HOST=smtp.example.com
#SMTP_PORT=587
# starttls (port 587, the default), tls (465), or none (a trusted LAN relay, 25)
#SMTP_TLS=starttls
#SMTP_USER=you@example.com

# The same condition (a unit, a disk) alerts at most once in this many hours.
#REPEAT_HOURS=12
