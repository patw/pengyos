# ============================================================================
# PengyOS Server — backup configuration (/etc/pengyos/backup.conf)
# ----------------------------------------------------------------------------
# Read by /usr/libexec/pengyos/pengyos-backup.sh (the pengyos-backup.service).
#
# The Server's backup strategy is intentionally plain: a timestamped tarball of
# the configured source trees, written to a backup destination, with a rolling
# retention count (keep the newest N, prune the rest). The .timer drives how
# often it runs; the script enforces retention on every run.
#
# OFF by default: nothing runs until `systemctl enable --now pengyos-backup.timer`.
# Every run is a full archive kept RETENTION_COUNT times, so BACKUP_DEST belongs
# on a different disk than BACKUP_SOURCES; on the same disk it fills the drive.
#
# Parsing is line-based: KEY=VALUE, "#" starts a comment, blank lines ignored.
# The script only reads the keys it understands and ignores the rest, so this
# file can grow without breaking the parser.
# ============================================================================

# Where timestamped backup tarballs are written. Created if it does not exist.
BACKUP_DEST=/var/backups/pengyos

# Space-separated list of source directories to archive. Non-existent sources
# are skipped with a warning to stderr.
BACKUP_SOURCES=/etc /home

# How many of the newest backups to keep; older ones are pruned on each run.
RETENTION_COUNT=7

# Compress the tarball with gzip (yes|no). "yes" -> .tar.gz, else .tar.
COMPRESS=yes
