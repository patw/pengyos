# ============================================================================
# PengyOS Server — monitoring configuration (/etc/pengyos/monitor.conf)
# ----------------------------------------------------------------------------
# Read by /usr/libexec/pengyos/pengyos-monitor.sh (the pengyos-monitor.service).
#
# This is a very small "stack": on a minimal Server there is no Prometheus or
# Grafana. The Server monitors itself the old-fashioned way — a script that
# samples the kernel's own views of the machine (uptime, load, memory, disk,
# network connections) and appends a single line per sample to a per-day log
# that `journalctl`/`tail` can show. The .timer drives how often it samples.
#
# Parsing is line-based: KEY=VALUE, "#" starts a comment, blank lines ignored.
# The script only reads the keys it understands and ignores the rest, so this
# file can grow without breaking the parser.
# ============================================================================

# Absolute path of the metrics log the service appends one line per sample to.
LOG_FILE=/var/log/pengyos-monitor.log

# How frequently pengyos-monitor.service should run (informational only — the
# authoritative cadence is the .timer's OnCalendar=; the script honours this
# as a minimum gap between samples when invoked directly).
SAMPLE_INTERVAL_SECS=300

# Which filesystems to report disk usage for (space-separated glob prefixes).
DISK_TARGETS=/ /var /home
