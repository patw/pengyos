#!/usr/sbin/nft -f
# ============================================================================
# PengyOS Server — nftables firewall ruleset (/etc/nftables.conf)
# ----------------------------------------------------------------------------
# Loaded by nftables.service at boot (ExecStart=/usr/sbin/nft -f /etc/nftables.conf).
# A conservative default-deny host firewall: allow loopback and
# established/related traffic, permit inbound SSH (22), drop everything else
# that is not already accepted. Tune the allow-list to the services this host
# actually runs.
# ============================================================================

# Start from a clean slate so a reload is idempotent.
flush ruleset

table inet pengyos {
    # Counters + a logging fallback for the final drop.
    chain input {
        type filter hook input priority 0; policy drop;

        # Always trust the loopback interface.
        iif "lo" accept

        # Allow traffic that is part of, or related to, a connection we
        # already established (reply traffic for outbound, continuations for
        # the inbound allows below).
        ct state established,related accept
        ct state invalid drop

        # ICMP (v4 + v6) needed for path-MTU discovery / diagnostics.
        ip protocol icmp accept
        # NOTE: IPv6 uses `nexthdr`, not `protocol` — `ip6 protocol icmpv6` is a
        # hard syntax error that made `nft -f /etc/nftables.conf` fail, so
        # nftables.service failed at boot (found 2026-09-22 via `nft -c`).
        ip6 nexthdr icmpv6 accept

        # Remote administration — SSH. Keep this narrow; open it further only
        # for hosts that are allowed to reach this server.
        tcp dport 22 ct state new accept

        # mDNS (link-local multicast): replies to printer/scanner/host discovery
        # (avahi, Desktop) arrive as new multicast packets, not as replies
        # conntrack can match, so they were dropped. Only the mDNS groups.
        ip daddr 224.0.0.251 udp dport 5353 accept
        ip6 daddr ff02::fb udp dport 5353 accept

        # Everything not explicitly accepted above is dropped by policy.
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
