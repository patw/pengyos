# PengyOS: smartd watches every disk it finds (DEVICESCAN, with smartd's default
# checks, -a) and hands each problem to pengyos-alert, which sends it over
# ntfy or mail as /etc/pengyos/alert.conf says (and always to the journal).
# Before this file a failing disk was logged and nobody heard of it: there is
# no mail transport on PengyOS, so smartd's own -m mail could never go out.
#
# -m root is required by smartd's syntax; the address is not used for mail.
# To check the path end to end, add `-M test` after `-M exec ...` and run
# `sudo systemctl restart smartd`: one test alert goes out at start.
# smartd.conf(5) has the rest (e.g. `-n standby` to let idle disks sleep).
DEVICESCAN -a -m root -M exec /usr/libexec/pengyos/pengyos-alert-smartd
