# systemd-oomd (Server): when swap (zram) is nearly full (oomd's SwapUsedLimit,
# 90%), kill the cgroup using the most swap, a whole service or container at
# once, before the kernel's OOM killer picks a single process somewhere.
# Swap only, no memory-pressure kills: on a build host a long compile sits under
# heavy pressure for hours and is exactly what a pressure rule would kill.
[Slice]
ManagedOOMSwap=kill
