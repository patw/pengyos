# PengyOS Server — autologin on the serial console (ttyS0).
#
# Instance-specific, mirrors systemd's own serial-getty@ ExecStart + -a root.
# Root autologin on LIVE boots only (usr/libexec/pengyos/agetty-autologin);
# installed systems get a normal login prompt.
[Service]
ExecStart=
ExecStart=-/usr/libexec/pengyos/agetty-autologin --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
