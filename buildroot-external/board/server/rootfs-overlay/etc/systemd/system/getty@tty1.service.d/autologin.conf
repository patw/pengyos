# PengyOS Server — autologin on the local video console (tty1).
#
# Instance-specific drop-in so it only affects the physical console; the serial
# console has its own drop-in under serial-getty@ttyS0.service.d/. Adds agetty's
# -a root so the headless server drops straight to a root shell on screen. The
# default ExecStart must be cleared first (an override that adds to ExecStart
# would run two gettys).
# Root autologin on LIVE boots only (usr/libexec/pengyos/agetty-autologin);
# installed systems get a normal login prompt.
[Service]
ExecStart=
ExecStart=-/usr/libexec/pengyos/agetty-autologin --noreset --noclear --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d - ${TERM}
