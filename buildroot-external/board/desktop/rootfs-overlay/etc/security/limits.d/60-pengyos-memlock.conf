# Locked memory: no limit for the pipewire group (Desktop).
#
# The Server layer removes systemd's 8 MiB default (DefaultLimitMEMLOCK=infinity in
# /usr/lib/systemd/{system,user}.conf.d/60-pengyos-memlock.conf) so that GPU
# containers can run with `--ulimit memlock=-1` (ROCm on an AMD APU, CUDA, RDMA).
# On Desktop, PipeWire's 25-pw-rlimits.conf sets `@pipewire - memlock 4194304`
# (4 GiB, soft and hard), and every desktop user is in @pipewire. pam_limits then
# capped each login at 4 GiB, so `--ulimit memlock=-1` silently gave a container
# 4 GiB (found on beholaptop, 26.11.2).
#
# pam_limits reads limits.d in name order, and a later entry for the same group
# replaces an earlier one, so this file restores "no limit" and leaves PipeWire's
# rtprio and nice lines alone. Locked memory still counts against a cgroup's
# MemoryMax=.
@pipewire   -   memlock   unlimited
