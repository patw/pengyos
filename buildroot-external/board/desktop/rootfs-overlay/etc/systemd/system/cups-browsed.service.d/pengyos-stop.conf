# PengyOS: cups-browsed must not hold up shutdown. On behoweather (2026-09-30)
# a reboot sat 90 s on it (stop-sigterm timed out, then SIGKILL): at exit it
# deletes the queues it created for network printers, talking to cupsd while
# the system is going down. KeepGeneratedQueuesOnShutdown (post-build, in
# cups-browsed.conf) skips that; this bounds whatever else it might wait on.
[Service]
TimeoutStopSec=10s
