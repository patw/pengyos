# PengyOS Desktop — hand the screen from the boot splash to COSMIC (as GDM does).
#
# Plymouth holds DRM master until it quits, so the compositor must start after
# it. Instead of letting plymouth-quit.service drop to a black screen, the
# session tells plymouth to quit but keep its last frame (--retain-splash) until
# cosmic-comp draws. Named to sort after wait-for-seat.conf: its ExecStartPre
# (the seat/output wait, most of the boot) runs first with the spinner still
# animating.
#
# `plymouth quit` only ASKS the daemon to quit and returns at once; plymouthd
# still holds DRM master for a moment. On the N100 (2026-09-29) cosmic-comp won
# that race: seatd "Could not make device fd drm master: Device or resource
# busy", cosmic-comp ran in "unprivileged mode" and could not modeset — the
# session either died (restarted 3 s later) or came up without panel and dock.
# So wait until the daemon is really gone (bounded: never hold the desktop up).
#
# Both commands need root: plymouthd only takes commands from root, and
# ExecStartPre runs as User= (the desktop user on an installed system) — there
# the quit was silently refused, --wait sat out its 10 s, and the session only
# came up after failing once. "+" runs them with full privileges.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service plymouth-start.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-+/usr/bin/plymouth quit --retain-splash
ExecStartPre=-+/usr/bin/timeout 10 /usr/bin/plymouth --wait
