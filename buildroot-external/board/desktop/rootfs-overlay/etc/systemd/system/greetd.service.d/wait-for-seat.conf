# PengyOS Desktop — start the COSMIC session only once the seat AND output are up.
#
# Two real N100 bites are baked into this gate:
#
#  2026-09-25 — seatd.service is Type=simple, so systemd marks it "started" the
#  moment it forks, BEFORE it creates seat0 and /run/seatd.sock. cosmic-session
#  raced the seat; cosmic-comp attached to a seat that never delivered pointer
#  events, so the desktop rendered but NOTHING was clickable until a manual
#  `systemctl restart cosmic-session` (which fixed it every time).
#
#  2026-09-27 — on the real N100 the FIRST boot came up with a wallpaper but no
#  panel / no dock and nothing interactive, even though every session process was
#  running and cosmic-comp held all the input fds. A restart fixed it again: the
#  shell had been spawned before the compositor had a usable OUTPUT, so the
#  panel's layer surfaces never mapped. So we now also wait for a CONNECTED DRM
#  connector before starting, and give udev settle a moment.
#
# Gate = seatd socket (created together with seat0) + DRM + input nodes + a
# connected output; then settle udev. The session therefore only ever starts
# against a seat that is fully ready AND an output that exists.
[Service]
ExecStartPre=/bin/sh -c 'n=0; while [ "$n" -lt 200 ]; do if [ -S /run/seatd.sock ] && ls /dev/dri/card* >/dev/null 2>&1 && ls /dev/input/event* >/dev/null 2>&1 && grep -lq ^connected /sys/class/drm/card*-*/status 2>/dev/null; then break; fi; n=$((n+1)); sleep 0.1; done; udevadm settle --timeout=20 2>/dev/null || true; sleep 1'
