# PengyOS: upstream never runs a user PipeWire for root (ConditionUser=!root).
# The live desktop *is* root's session, so allow root there — and only there: on an
# installed system root stays excluded, so e.g. a root SSH login can't start a
# second PipeWire that fights the desktop user's for the sound card.
#
# "Live" is decided by the boot, the test greetd-config and agetty-autologin use:
# an installed system boots with `pengyos.data=` on the kernel line, a live image
# does not. ConditionKernelCommandLine matches a whole word or a `word=value` pair,
# so `pengyos.data` covers `pengyos.data=4`.
#
# This used to test for the PENGYOS-PAYLOAD partition label, which only the
# *installer* stick has — so the plain live image (pengyos-desktop-x86_64.img), a
# root session with no payload, got no PipeWire at all: no sound devices and no
# device profiles. The same wrong proxy the login screen used; found on behotv
# 2026-10-08.
#
# Conditions prefixed with | are OR'ed: not root, OR a live boot.
[Unit]
ConditionUser=
ConditionUser=|!root
ConditionKernelCommandLine=|!pengyos.data
