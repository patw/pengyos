# PengyOS: upstream never runs a user PipeWire for root (ConditionUser=!root).
# The installer stick's live desktop *is* root's session, so allow root there —
# and only there (the PENGYOS-PAYLOAD partition exists only on the stick). On an
# installed system root stays excluded, so e.g. a root SSH login can't start a
# second PipeWire that fights the desktop user's for the sound card.
# Conditions prefixed with | are OR'ed: not root, OR on the stick.
[Unit]
ConditionUser=
ConditionUser=|!root
ConditionPathExists=|/dev/disk/by-label/PENGYOS-PAYLOAD
