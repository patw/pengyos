# ============================================================================
# PengyOS Desktop — AMDGPU (open) kernel driver options
# ----------------------------------------------------------------------------
# Part of the Desktop board rootfs-overlay (etc/modprobe.d/), so it also ships
# in Desktop NVIDIA, which reuses this board. Never stub out the nvidia*
# modules here: that edition's driver comes from package/nvidia-open
# (usr/lib/modprobe.d/nvidia.conf), and an `install nvidia* /bin/true` in this
# file silently left it on simpledrm (one monitor, firmware mode; 26.10.6).
# ============================================================================

# --- amdgpu: the open AMDGPU kernel driver ---------------------------------
# Enable KMS modesetting and runtime PM (d3cold) so the iGPU idles low and the
# eDP screen comes up cleanly. `modeset=1` is the modern default but is pinned
# here for the hybrid eDP path; `psr=1` enables panel self-refresh (power save
# on static content).
options amdgpu modeset=1 psr=1

# --- nouveau: kept off ------------------------------------------------------
# NVIDIA GPUs are driven by the proprietary driver on open modules (Desktop
# NVIDIA), not nouveau; on the plain Desktop the dGPU stays unbound.
install nouveau /bin/true
