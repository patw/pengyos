# GTK 3 defaults to match COSMIC (the host's only GTK program is the portal's
# dialogs: "Open with", print). Unset, GTK looks for the Adwaita icon theme,
# which is not installed, and its dialogs had no icons. Per user, COSMIC
# Settings' "apply theme to GNOME apps" writes ~/.config/gtk-3.0 over this.
[Settings]
gtk-icon-theme-name=Cosmic
gtk-cursor-theme-name=Pop
gtk-font-name=Fira Sans 10
