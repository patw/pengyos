# PengyOS Desktop display settings (read at boot).
#
# VIRTUAL_DISPLAY: when the machine boots with no monitor connected (run
# headless, or the monitor asleep and off HDMI), make one HDMI port a virtual
# 1920x1080 display so the desktop starts and remote desktop (pengyos-remote)
# has a screen to show. A monitor plugged into another port replaces it; one
# plugged into that same port shows at 1920x1080 until the next restart.
#   auto  on when no monitor is connected at boot (default)
#   off   never: with no monitor at boot the desktop does not start
# `journalctl -b -u pengyos-virtual-display` says what it did this boot.
VIRTUAL_DISPLAY=auto
