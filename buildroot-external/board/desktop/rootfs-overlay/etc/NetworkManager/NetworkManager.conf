# PengyOS Desktop: NetworkManager is the network service (systemd-networkd is
# not built). Stock behaviour otherwise: NM manages every real device and starts
# wpa_supplicant over D-Bus for Wi-Fi.
#
# Until 26.10.23 this file and five others came from tools/pengyos-desktop-net,
# which wrote keys NM does not have (auth-agent=, [device] devices=*: "unknown
# key" at every start), a wpa_supplicant.conf with a placeholder network, COSMIC
# panel/settings TOML that COSMIC never reads, and /wifi-firmware.txt. The tool
# is retired; this is what was real.

[main]
plugins=keyfile

[keyfile]
# Bridges that libvirt and container runtimes create belong to them, not NM.
unmanaged-devices=interface-name:virbr*;interface-name:br-*
