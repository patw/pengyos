# PengyOS Desktop: closing the lid suspends, as logind does by default; on
# external power too, and not while docked to an external display. This
# replaces the Server's copy of this file, which ignores the lid (laptops as
# servers run with it shut).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
