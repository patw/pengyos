# PengyOS Desktop: avahi is the mDNS responder (printers, scanners, services).
# systemd here is built with default-mdns=yes, so resolved also published the
# hostname on :5353, and avahi lost to it on every boot ("Host name conflict,
# retrying with <host>-2..-4"): <host>.local stopped being avahi's name.
# "resolve" keeps resolved doing .local lookups (nsswitch asks resolve first,
# so "no" would break "ssh host.local") but stops it publishing anything.
[Resolve]
MulticastDNS=resolve
