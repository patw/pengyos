# PengyOS Desktop: avahi is the mDNS stack (printers, scanners, services, and
# name.local lookups through nss-mdns). systemd here is built with
# default-mdns=yes, so resolved also published the hostname on :5353 and avahi
# lost to it on every boot ("Host name conflict, retrying with <host>-2..-4").
# 26.10.20 set "resolve" here, which stopped the publishing but kept resolved's
# own mDNS socket open next to avahi's (avahi: "Detected another IPv4 mDNS stack
# running on this host. This makes mDNS unreliable"). Since 26.10.23 nsswitch
# asks avahi for .local before resolved (board/desktop/post-build.sh), so
# resolved needs no mDNS at all. (The file keeps its 26.10.20 name: Buildroot
# never deletes from target/, so a renamed file would leave the old one behind.)
[Resolve]
MulticastDNS=no
