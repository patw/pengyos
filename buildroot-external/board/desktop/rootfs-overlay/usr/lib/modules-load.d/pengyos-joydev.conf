# joydev creates /dev/input/jsN, the joystick device: the legacy API Steam
# Input talks to, and the only node a rumble (force-feedback) request can be
# sent on. It is a module here and nothing auto-loads it at boot (a module
# loaded by a udev alias only appears when a matching device is plugged in,
# and jsN must exist for the udev rule's group to be applied to it), so load
# it at startup — the same reason steam-uinput.conf exists.
joydev
