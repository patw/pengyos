# joydev creates /dev/input/jsN, the legacy joystick API that older games (and
# SDL's fallback path) still read. It is a module here and nothing auto-loads
# it at boot (a module loaded by a udev alias only appears when a matching
# device is plugged in, and jsN must exist for the udev rule's group to be
# applied to it), so load it at startup — the same reason steam-uinput.conf
# exists. Rumble does NOT need it: force feedback is an evdev interface and
# goes to /dev/input/eventN (tools/pengyos-gamepads/src/raw.rs).
joydev
