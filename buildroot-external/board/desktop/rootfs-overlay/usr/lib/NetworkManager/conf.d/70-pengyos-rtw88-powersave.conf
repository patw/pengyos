# PengyOS Desktop: Wi-Fi power save off for Realtek rtw88 cards.
#
# With power save on, rtw88 puts the card into LPS (its low-power state) and the
# firmware stops acknowledging the driver's commands, so traffic stalls until it
# wakes. Found on behocraptop (RTL8821CE, rtw88_8821ce): 5759 "failed to send h2c
# command" and 1104 "firmware failed to leave lps state" in 41 minutes, and Wi-Fi
# crawled. Setting power save off on the connection profile fixed it. NM's default
# is "ignore", which leaves the driver's default (on), so a fix per profile is lost
# on the next network joined; this file covers every profile on these drivers.
#
# Scoped to rtw88 because the cost is battery: other drivers keep their own
# default. driver: matches literally (no globs, NetworkManager.conf(5)), so each
# rtw88 bus driver in Linux 7.2 is named: the PCIe, SDIO and USB ones, built or not.
# A profile that sets 802-11-wireless.powersave itself still wins.
#
# A user's override goes in /etc/NetworkManager/conf.d/, which NM reads after this.

[connection-pengyos-rtw88-powersave]
match-device=driver:rtw88_8723de,driver:rtw88_8814ae,driver:rtw88_8821ce,driver:rtw88_8822be,driver:rtw88_8822ce,driver:rtw88_8723cs,driver:rtw88_8723ds,driver:rtw88_8821cs,driver:rtw88_8822bs,driver:rtw88_8822cs,driver:rtw88_8723du,driver:rtw88_8812au,driver:rtw88_8814au,driver:rtw88_8821au,driver:rtw88_8821cu,driver:rtw88_8822bu,driver:rtw88_8822cu
# 2 = disable (NMSettingWirelessPowersave)
wifi.powersave=2
