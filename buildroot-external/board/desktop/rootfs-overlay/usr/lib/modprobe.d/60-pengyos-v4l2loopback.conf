# v4l2loopback (OBS's virtual camera). Not loaded at boot: OBS loads it on demand
# (`pkexec modprobe v4l2loopback`) when "Start Virtual Camera" is pressed. These
# are the options OBS itself passes. exclusive_caps=1 is what lets browsers and
# Chromium/Electron apps (Discord, Meet, Zoom) list it as a camera, and it stays
# invisible as a capture device until OBS writes to it. Override in
# /etc/modprobe.d/.
options v4l2loopback devices=1 exclusive_caps=1 card_label="OBS Virtual Camera"
