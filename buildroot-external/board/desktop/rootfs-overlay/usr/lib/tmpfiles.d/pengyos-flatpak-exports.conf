# PengyOS: Flatpak's export folders exist from boot, before the COSMIC session.
# flatpak creates them with the first app it installs; COSMIC's panel scans the
# icon folders once, at startup, so an app installed later in that session
# (Firefox, installed in the background on the first boot) showed the generic
# gear icon in the dock until the panel restarted (behoweather, 2026-09-30).
d /var/lib/flatpak/exports/share/applications 0755 root root -
d /var/lib/flatpak/exports/share/icons/hicolor 0755 root root -
