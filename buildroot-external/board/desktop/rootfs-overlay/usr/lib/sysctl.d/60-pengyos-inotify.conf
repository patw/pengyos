# PengyOS Desktop: the kernel sizes max_user_watches from RAM (137830 on a 14 GB
# N100), below what editors and file watchers expect. VS Code opened with
# "Unable to watch for file changes". 524288 is VS Code's documented value and
# what Fedora and Ubuntu desktops ship. Override in /etc/sysctl.d/.
fs.inotify.max_user_watches = 524288
# The other half: each watching program also takes an inotify *instance*, and the
# kernel default of 128 per user runs out with an editor, Syncthing and a few
# Electron apps open ("Too many open files" from inotify_init). 8192 leaves room.
fs.inotify.max_user_instances = 8192
