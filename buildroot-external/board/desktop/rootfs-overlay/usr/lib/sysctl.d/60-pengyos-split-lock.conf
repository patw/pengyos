# PengyOS Desktop: on Intel CPUs with split-lock detection, the kernel stalls a
# thread for ~10 ms on each split-lock trap ("misery mode"). Steam's client and
# some games under Proton trap (behoweather's N100 logs steam, IPC:CSteamEngin
# and gldriverquery), and the stall shows up as stutter. 0 keeps the kernel log
# warning and drops the stall. Bazzite, CachyOS (cachyos-gaming-meta) and Nobara
# all ship 0. Server editions keep the kernel default, 1: the stall is
# what stops one unprivileged process from slowing every core. Override in
# /etc/sysctl.d/.
kernel.split_lock_mitigate = 0
