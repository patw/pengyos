# PengyOS — drive PCI/HDA sound cards as plain ALSA PCMs ("split" mode), so
# every output, HDMI/DisplayPort included, is a sink of its own.
#
# WirePlumber defaults every ALSA card to ACP (api.alsa.use-acp = true). ACP
# reads UCM, but alsa-ucm-conf's HDA.conf only defines a profile for AMD
# digital-mic (ACP) and DualCodecs machines; a plain HDA card falls back to
# ACP's classic profiles, which offer analog OR HDMI, one at a time. On the N100
# that picked "Analog Stereo" and the monitor's speakers were unreachable (the
# only output in Sound settings was line out). use-acp = false bypasses ACP and
# UCM altogether (an earlier version of this comment said it selected UCM: it
# doesn't) and exposes each PCM.
#
# The cost: on this path PipeWire only does software volume and never touches
# the codec's mixer. pengyos-alsa-unity.service sets each PCI card's Master and
# PCM to 0 dB at boot, or the power-on default (-20 dB on a ThinkPad T14's
# ALC257) left the speakers quiet at 100%.
#
# Scoped to PCI cards (alsa_card.pci-*): USB DACs and interfaces keep ACP.
# The rule runs after WirePlumber's applyDefaultDeviceProperties (alsa.lua), so
# update-props overrides the default; device.name is set before rules run.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.pci-.*" } ]
    actions = { update-props = { api.alsa.use-acp = false } }
  }
]
