set default="0"
# Hidden menu: boot after 1 s; hold Esc (or Shift) to show it.
set timeout_style="hidden"
set timeout="1"

# Full-screen graphical menu with a scalable font (mirrors Core). Without
# this GRUB falls back to the firmware's 80x25 text mode. The font
# (grub-pengyos.pf2) is staged next to this file on the ESP by post-build.sh;
# the video/gfxterm modules are baked into the grub image via
# BR2_TARGET_GRUB2_BUILTIN_MODULES_EFI. gfxmode=auto picks the firmware's native
# mode; gfxpayload=keep hands it to the kernel.
insmod all_video
insmod gfxterm
set gfxmode=auto
set gfxpayload=keep
if loadfont /EFI/BOOT/grub-pengyos.pf2; then
    set gfxterm_font=PengyOS24
    terminal_output gfxterm
fi

# Serial console only where there is a serial port (2026-10-03): with
# console=ttyS0 on a ThinkPad L14 Gen 1 AMD whose "Security Chip" was off, boot
# crawled for minutes behind a black screen; Ubuntu (no serial console) was
# fine. GRUB's serial driver keeps a port only if its scratch register reads
# back, which a phantom port at 0x3F8 (all 0xFF) fails and QEMU's UART passes.
# On real hardware the serial console also gets loglevel=4 (the kernel half of
# `quiet`; systemd's status lines still go out): at 115200 baud each kernel
# message costs ~6 ms, ~5 s of black screen on an ASUS PRIME Z790-P with a COM
# header (2026-10-04). QEMU keeps the full kernel log there for testing.
set pengyos_serial=""
if serial --unit=0 --speed=115200; then
    set pengyos_serial="console=ttyS0,115200"
    smbios --type 1 --get-string 4 --set pengyos_vendor
    if [ "${pengyos_vendor}" != "QEMU" ]; then
        set pengyos_serial="loglevel=4 console=ttyS0,115200"
    fi
fi

menuentry "PengyOS Desktop (systemd) — console" {
    linux /bzImage root=PARTUUID=UUID_TMP rw rootwait audit=0 splash plymouth.ignore-serial-consoles console=tty0 ${pengyos_serial}
}
