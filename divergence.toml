# Six avidemux fixes for two CVEs: the pair is closed by the set together, which is why
# every patch in cve-declarations.mk repeats both - the declaration is per patch file, and
# the last one applied is what closes them.
closes = ["CVE-2026-73433", "CVE-2026-73434"]
upstream_fixes = [
  "bb8fb5a9bf15", "ed6dcb332204", "c8383e484841",
  "0bcc6564c7de", "30966f12aff2", "44383c6de722",
]
# Same GStreamer lockstep as gst1-plugins-bad above: one version bump retires both sets.
