# PengyOS divergence ledger
#
# Every divergence we carry — a fork, a patch set, or a host-built component —
# gets an entry here BEFORE it lands. The ledger is what makes the divergence
# budget (docs/stack-down-replace.md) enforceable instead of rhetorical, and it
# is what turns "this version number looks wrong" into "this version number looks
# wrong, and here is the receipt".
#
# kind:
#   patch-set   upstream fix commits carried on a pinned version (version unchanged)
#   fork        a component we build from our own tree with our own changes
#   host-built  assembled on the build host, not by a Buildroot recipe (a debt,
#               not an achievement: it voids byte-identity reproducibility)
#   build-fix   our patches to an authored recipe that only make it build here
#               (cross builds, offline vendoring, an optional dependency we do not
#               ship) and change nothing it does at run time. Ledgered like a fork,
#               with an expiry and an observe source, but not counted against the
#               fork budget: a build fix is packaging, not a divergence in behaviour.
#               A patch that changes behaviour is a fork, however small.
#
# Required for every entry: id, kind, component, carried_since, expiry,
# observe_source, upstream_status.
#
# Both directions of that rule are enforced, not documented:
#   - an entry must be declared to pkg-stats if it carries patches
#     (scripts/pengyos_gate.py:check_patch_declarations);
#   - every patch set in the tree must have an entry here, and so must every
#     authored recipe that carries patches of ours (package/<name>/*.patch, claimed
#     by the entry's `recipe`; since 2026-10-27)
#     (scripts/pengyos_gate.py:check_ledger_covers_patch_sets), because the entry is
#     the only thing that carries an expiry. Added 2026-10-18: the tree carried five
#     patch sets and only two were ledgered, so three divergences had no exit
#     condition and nothing said so.
#
# `expiry` is the specific upstream event that ends the divergence. An entry with
# no expiry condition is not an approved divergence.
#
# `observe_source`: "pkg-stats" means Buildroot's own scanner can still see the
# component. A fork or authored pin is invisible to pkg-stats and MUST name its
# own pengyos-nightly observe source, or it rots silently (the PengyR case:
# images shipped 1.10.0 while upstream was at 1.11.1 and nothing noticed). The one
# exception is a fork of a component Buildroot has no recipe for: our recipe is
# then the only one and pkg-stats tracks it by name, so the entry may say
# "pkg-stats" if it also gives `release_monitoring_id`, the project pkg-stats
# reports (pkgstats-<target>.json, packages.<name>.latest_version.id).

schema = 1

# The fork budget, as a value the gate can read (not prose it has to trust).
# scripts/pengyos_gate.py:check_fork_budget counts kind = "fork" entries against this
# and fails the repo past it. Raising it is a written decision in this file.
fork_budget = 10

# Budget: at most 10 maintained forks (kind = "fork") at any time.
# Current fork count: 8 (ffmpeg-pengyos, hplip-pengyos 2026-10-19; upower-pengyos
# 2026-10-20; libdisplay-info-pengyos 2026-10-23; uutils-findutils, distrobox,
# xdg-utils 2026-10-27; ironrdp-server 2026-10-31). openssh-pengyos (2026-10-19) expired with Buildroot
# 2026.08.1 on 2026-10-28. build-fix entries are not counted. The gate's count is
# authoritative; this line is the human copy.
# Enforced by the gate from 2026-10-19: scripts/pengyos_gate.py:check_fork_budget counts
# kind = "fork" entries against `fork_budget` above and fails past it. It also fails a
# fork whose observe_source is pkg-stats, because pkg-stats cannot see a fork at all -
# it scans the stock recipe, and the stock recipe is switched off - unless the fork
# has no stock recipe and gives its release_monitoring_id (see observe_source above).
# Before that the count was by hand, and this file claimed the gate enforced it — which
# is what its own header promises and the gate did not do.

[[divergence]]
id        = "upower-1.91.5-fork"
kind      = "fork"
component = "upower-pengyos"
pinned_version = "1.91.5"
editions  = ["pengyos-desktop", "pengyos-desktop-nvidia"]
carried_since = "2026-10-20"
recipe        = "buildroot-external/package/upower-pengyos"

# Not a CVE: two functional bugs in Buildroot 2026.08's upower 0.99.19, a recipe Buildroot
# has not touched since 2022-06 (master included) while upstream moved to 1.91.5.
#  1. The battery stops updating after resume from suspend. Found on beholaptop,
#     2026-10-20: the panel read 75% / 7.1 h for 83 minutes while the kernel read
#     48% / 1.7 h. upowerd pauses polling on logind's PrepareForSleep; a poll that fires
#     while paused returns without re-arming its GSource, and 0.99.19's
#     up_daemon_resume_poll() only clears the flag, so polling is dead until an AC change
#     or a restart. Measured: ~5.7 s of monotonic time passes paused per suspend against a
#     30 s poll, so about one suspend in five. Fixed upstream by e88e90fafa05 "daemon:
#     Reevaluate polling timeout after resume" (2022-07-12, upstream issue #198, first in
#     v1.90.0), which re-arms the source in resume_poll (1.91.5: src/up-daemon.c:1106).
#     Reproduced deterministically, 2026-10-20, with upstream's own umockdev/dbusmock
#     harness (src/linux/integration-test.py) plus one added test that holds the sleep
#     past one 30 s poll and then drains the battery with no uevent: 0.99.19 FAILS
#     ("battery not re-read within 40 s of resume"), 1.91.5 passes, and 1.91.5 with only
#     e88e90fafa05's line removed FAILS again. Upstream's test_refresh_after_sleep passes
#     on both, because it checks only the one refresh at wake-up - which is why this
#     shipped. The added test is kept at behoserver:/data/tmp/upower-1.91.5/
#     test_poll_rearmed_after_sleep.py and is worth offering upstream.
#  2. capacity_level read as "Ful" against libgudev >= 238 (upstream 6bfe66a, in 1.90.1):
#     level-only peripherals (Logitech HID++ mice) showed 0%. Carried on 0.99.19 as the
#     patch set upower-0.99.19-capacity-level from 2026-10-11 (26.10.24); that entry's own
#     expiry was "or we author a newer recipe", which this is, so the set is deleted.
# Neither has an NVD entry to carry as a CVE patch, and a stock version cannot be moved
# from a br2-external tree, so the fix is the version and the shape is a named fork - the
# same decision as openssh, ffmpeg and hplip. Upstreaming the bump to Buildroot is the
# intended pay-down (the stock recipe has no maintainer moving it).
closes = []
upstream_fixes = ["e88e90fafa05", "6bfe66a390cb"]
natural_fix = "1.90.1"

# The cost, written where it can be seen. thermald links libupower-glib and its stock
# Config.in selects BR2_PACKAGE_UPOWER (package/thermald/Config.in), and a Kconfig select
# outranks a defconfig line: with stock thermald in the config, upower 0.99.19 is built
# and installed beside the fork - the mosh -> openssh trap. So thermald ships as
# package/thermald-pengyos, a copy of the stock 2.5.6 recipe whose only change is the
# upower-pengyos dependency (same version, same tarball hash, CPE intel:thermald, so
# pkg-stats still matches its CVEs). It carries no version of its own and goes away with
# this fork. libupower-glib keeps soversion 3 at 1.91.5, so thermald's ABI does not move.
# power-profiles-daemon (our recipe) selected stock upower too; it now selects the fork.
cost = "thermald ships as thermald-pengyos (stock 2.5.6 rebuilt against the fork, because stock thermald selects stock upower); power-profiles-daemon's select and dependency point at the fork; the capacity_level patch set on 0.99.19 is deleted"

# gitlab's archive tarball has no upstream checksum or signature. It was extracted and
# compared with `diff -r` against a clone of tag v1.91.5 (commit 233615a1505166ef4a28c959836fe8c7781f5697),
# identical, on 2026-10-20; the .hash line is that tarball's sha256.
provenance = "git tag v1.91.5 = 233615a1505166ef4a28c959836fe8c7781f5697 (tarball diffed against the tag)"

expiry = "Buildroot releases with upower >= 1.91.5: delete buildroot-external/package/upower-pengyos and package/thermald-pengyos, restore BR2_PACKAGE_UPOWER and BR2_PACKAGE_THERMALD in configs/layers/desktop.config, point power-profiles-daemon's select and dependency back at upower, and remove the upower-fork observe source from pengyos-nightly"
observe_source = "pengyos-nightly observe, source id upower-fork: git ls-remote --tags https://gitlab.freedesktop.org/upower/upower.git compared to UPOWER_PENGYOS_VERSION (sources.upower_fork_findings, added 2026-10-20 with the fixture tests/fixtures/ls-remote-upower.txt). pkg-stats cannot see a fork, and NVD lists no upower CPE, so this is the only observer."
upstream_status = "released"

