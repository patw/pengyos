# PengyOS divergence ledger
#
# Every divergence we carry — a fork, a patch set, or a host-built component —
# gets an entry here BEFORE it lands. The ledger is what makes the divergence
# budget (docs/stack-down-replace.md) enforceable instead of rhetorical, and it
# is what turns "this version number looks wrong" into "this version number looks
# wrong, and here is the receipt".
#
# kind:
#   patch-set   upstream fix commits carried on a pinned version (version unchanged)
#   fork        a component we build from our own tree with our own changes
#   host-built  assembled on the build host, not by a Buildroot recipe (a debt,
#               not an achievement: it voids byte-identity reproducibility)
#
# Required for every entry: id, kind, component, carried_since, expiry,
# observe_source, upstream_status.
#
# Both directions of that rule are enforced, not documented:
#   - an entry must be declared to pkg-stats if it carries patches
#     (scripts/pengyos_gate.py:check_patch_declarations);
#   - every patch set in the tree must have an entry here
#     (scripts/pengyos_gate.py:check_ledger_covers_patch_sets), because the entry is
#     the only thing that carries an expiry. Added 2026-10-18: the tree carried five
#     patch sets and only two were ledgered, so three divergences had no exit
#     condition and nothing said so.
#
# `expiry` is the specific upstream event that ends the divergence. An entry with
# no expiry condition is not an approved divergence.
#
# `observe_source`: "pkg-stats" means Buildroot's own scanner can still see the
# component. A fork or authored pin is invisible to pkg-stats and MUST name its
# own pengyos-nightly observe source, or it rots silently (the PengyR case:
# images shipped 1.10.0 while upstream was at 1.11.1 and nothing noticed).

schema = 1

# Budget: at most 10 maintained forks (kind = "fork") at any time.
# Current fork count: 0. Enforced by the gate, not by good intentions.

[[divergence]]
id        = "libxml2-2.15.3-cve-2026"
kind      = "patch-set"
component = "libxml2"
pinned_version = "2.15.3"
editions  = ["pengyos-desktop", "pengyos-desktop-nvidia"]
carried_since = "2026-10-05"
carried_in    = ["26.10.8"]
patches_dir   = "buildroot-external/patches/libxml2/2.15.3"

# NVD placed 2.15.3 inside each affected range and named one upstream commit per
# CVE; that is what made the patch shape admissible at all (pengyos-nightly
# guards: evidence_required, fix_commits_available).
closes = [
  "CVE-2026-86137",  # 76fe08d97de8  xmlregexp: out-of-bounds read in the NXT macro
  "CVE-2026-86138",  # a4cba4b5b5a8  dict: overflow in xmlDictAddQString
  "CVE-2026-86139",  # 8edbbdb09f24  uri: length check in xmlURIEscapeStr
  "CVE-2026-86140",  # d1686f91dbda  valid: bounds checks in xmlSnprintfElements
  "CVE-2026-86142",  # 6b3a736c0edc  xpointer: overflow in xmlXPtrEvalXPtrPart
  "CVE-2026-86143",  # 90f293ba74d2  io: int overflow before writeCallback
  "CVE-2026-86144",  # b63cd517afec  xinclude: propagate parse flags
]
upstream_fixes = [
  "76fe08d97de8", "a4cba4b5b5a8", "8edbbdb09f24", "d1686f91dbda",
  "6b3a736c0edc", "90f293ba74d2", "b63cd517afec",
]

# The version that would have closed all seven with no divergence at all. Recorded
# because it is the reason this entry has an expiry instead of a permanent home.
natural_fix = "2.15.4"

expiry = "Buildroot 2026.08.1 (or a newer Buildroot line) pins libxml2 >= 2.15.4; at that point the patch set is deleted"
observe_source = "pkg-stats"
upstream_status = "not-offered"

# Known cost, stated rather than discovered: a patch set does not move the version,
# so every version-based reader misreads it. pkg-stats does not see patches reached
# through BR2_GLOBAL_PATCH_DIR at all (support/scripts/pkg-stats:250 walks only the
# package's own directory), so libxml2 reported "affected by CVEs" and "newer version
# 2.15.4 available upstream" even after 26.10.8 shipped the fixes.
#
# Declared 2026-10-07: LIBXML2_IGNORE_CVES names all seven CVEs, each preceded by a
# comment naming its patch file, in buildroot-external/patches/cve-declarations.mk
# (included from external.mk). Verified against the real tree - `make printvars
# VARS=LIBXML2_IGNORE_CVES` in output/pengyos-desktop now reports all seven, and
# `make libxml2-dirclean && make libxml2-patch` still applies all seven cleanly, so the
# declaration is inert for the build. pkg-stats suppresses each CVE from the next scan
# onward and will flag the entries as stale ignores once a Buildroot line pins
# libxml2 >= 2.15.4 - the expiry signal doing its job. The gate
# (scripts/pengyos_gate.py:check_patch_declarations) now fails the repo if a patch set
# in this ledger is not declared, or declares a CVE the ledger does not close - and
# pengyos-nightly writes that declaration itself now, from the patches that survived its
# own pre-flight.

[[divergence]]
id        = "upower-0.99.19-capacity-level"
kind      = "patch-set"
component = "upower"
pinned_version = "0.99.19"
editions  = ["pengyos-desktop", "pengyos-desktop-nvidia"]
carried_since = "2026-10-11"
carried_in    = ["26.10.24"]
patches_dir   = "buildroot-external/patches/upower/0.99.19"
# Not a CVE: a functional fix. Buildroot 2026.08 pins UPower 0.99.19 (2022)
# against libgudev 238, which strips the trailing newline from sysfs values
# itself; 0.99.19 then chopped the last character too ("Ful"), found no
# percentage, and never updated any device that reports only a battery level.
# Found on behoweather: a Logitech G305 (HID++ unified battery,
# capacity_level=Full) showed 0% with a "missing battery" icon in COSMIC
# Settings → Power. Hits most Logitech HID++ mice/keyboards and other
# level-only peripherals.
closes = []
upstream_fixes = ["6bfe66a390cb"]
natural_fix = "1.90.1"
expiry = "Buildroot pins upower >= 1.90.1 (or we author a newer recipe); the patch set is deleted then"
observe_source = "pkg-stats"
upstream_status = "merged"

[[divergence]]
id        = "gst1-plugins-bad-1.24.13-cve-2026-2923"
kind      = "patch-set"
component = "gst1-plugins-bad"
pinned_version = "1.24.13"
editions  = ["pengyos-desktop", "pengyos-desktop-nvidia"]
carried_since = "2026-10-08"
carried_in    = ["26.10.14"]
patches_dir   = "buildroot-external/patches/gst1-plugins-bad/1.24.13"
# One bounds-check fix (dvbsuboverlay, CVE-2026-2923). NVD attributes the fix to
# gstreamer1 - the monorepo - and pengyos-nightly attributes it to the package it lands
# in: gst-plugins-bad/, which we ship as gst1-plugins-bad at the same 1.24.13 lockstep.
# Same pin as gst1-plugins-good below; one GStreamer bump retires both.
closes = ["CVE-2026-2923"]
upstream_fixes = ["3b8253f447bc"]
natural_fix = "1.28.1"
# 1.28.1 is where NVD's affected range stops, so a Buildroot line pinning >= 1.28.1
# closes this with no divergence at all.
expiry = "Buildroot pins gst-plugins-bad at or above 1.28.1 (where NVD's range stops); the patch set is deleted then"
observe_source = "pkg-stats"
upstream_status = "merged"


[[divergence]]
id        = "ffmpeg-6.1.5-cve-2026"
kind      = "patch-set"
component = "ffmpeg"
pinned_version = "6.1.5"
editions  = ["pengyos-desktop", "pengyos-desktop-nvidia"]
carried_since = "2026-10-10"
carried_in    = ["26.10.21"]
patches_dir   = "buildroot-external/patches/ffmpeg/6.1.5"
# Twelve upstream fix backports onto Buildroot's pinned 6.1.5. Each was authored against
# a newer series, so pengyos-nightly's per-patch pre-flight is what admits them: a fix
# that does not apply is dropped by name and takes its CVE with it, and does not block
# the other eleven. Patch numbers are not contiguous (0005, 0008, 0014 are absent): those
# fixes were already in the pinned tarball or did not apply, and the tree carries only
# what survived.
closes = [
  "CVE-2026-70628",  # 0001 dvbsub parser: signed overflow in the capacity computation
  "CVE-2026-64834",  # 0002 rtpdec_asf: reject undersized ASF objects
  "CVE-2026-64835",  # 0003 adx: sync channel state on new extradata
  "CVE-2026-70631",  # 0004 tiff: reject short inflate output
  "CVE-2026-64833",  # 0006 spdifenc: bound the DTS core size against the packet
  "CVE-2026-70630",  # 0007 screenpresso: reject short deflate output
  "CVE-2026-65706",  # 0009 vf_swaprect: size the temp row buffer for the widest plane
  "CVE-2026-66039",  # 0010 mace: reject sample counts that overflow int
  "CVE-2026-64830",  # 0011 vobsub: reuse subtitle streams, bound the stream count
  "CVE-2026-65704",  # 0012 ty: don't let the Series2 AC3 trim underflow
  "CVE-2026-66038",  # 0013 lcldec: zero the not-decoded tail
  "CVE-2026-65703",  # 0015 tdsc: unref the reference frame before reallocating
]
upstream_fixes = [
  "02fc47e13f90", "11d5f475be95", "1836ef968469", "2f234ea34c81",
  "6f80e2765492", "705890061467", "a7e38b617b32", "aafb5c655edc",
  "dbd495f066a8", "de771bd52774", "e7cbfd1c507b", "fd3ee52fab34",
]
# No single natural fix version is recorded: these twelve were authored across more than
# one release series, so the expiry is anchored to the signal rather than to a guess.
# pkg-stats flags an ignore as stale once the pinned version leaves the CVE's NVD range -
# that flag is the expiry firing, and it is checked by machine on every scan.
expiry = "Buildroot pins an ffmpeg version outside the NVD range of all twelve CVEs; pkg-stats then reports the ignores as stale and the patch set is deleted"
observe_source = "pkg-stats"
upstream_status = "merged"


[[divergence]]
id        = "gst1-plugins-good-1.24.13-cve-2026-73433"
kind      = "patch-set"
component = "gst1-plugins-good"
