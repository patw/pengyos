# section, and the trailing is_all_zeroes() padding check, still sized for the previous
# cursor, reads past the EDID buffer. An out-of-bounds read (crash), reachable from any
# monitor, KVM or capture device through cosmic-comp. 0.3.0's displayid.c:697 is the same
# loop as 0.4.0's. No upstream fix exists (no commit or MR on 2026-10-23; last commit
# 2026-08-31), so patches/README.md rule 1 puts our own fix here, in a recipe we author:
# 0001-displayid-check-padding-only-over-the-bytes-the-section-has-left.patch recomputes the
# remaining size from the final cursor and skips the check when nothing remains.
# Reproduced and verified 2026-10-23 with AddressSanitizer, through di_info_parse_edid on
# an EDID in a heap buffer of its own size (as a compositor holds one): unpatched gives a
# heap-buffer-overflow READ 135 bytes past a 256-byte EDID at displayid.c:697; patched
# gives none and still reports the over-long block. The same stale size also gave a false
# "Padding: Contains non-zero bytes" when a block exactly fills the section; fixed with it.
# Upstream meson test: 64/64 before and after (3 test EDIDs have a DisplayID extension).
# Reproducer: behoserver:/data/tmp/ldi/repro/ (mkedid.py, harness.c).
#
