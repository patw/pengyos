# Not a CVE: a build fix that follows from ffmpeg-9.0.2-fork. gst-libav 1.24.13
# names AV_CODEC_ID_V308/V408/V410 in its "no quasi codecs, please" filter in both
# gstavviddec.c and gstavvidenc.c, and ffmpeg 9 removed those three IDs (present in
# 6.1.5's codec_id.h, absent from 9.0.2's), so the plugin does not compile:
#   gstavvidenc.c:1031:26: error: 'AV_CODEC_ID_V308' undeclared
# Checked against gst-libav 1.24.13, 1.26.0 and 1.28.8 - all three name them, so no
# gst-libav release builds against ffmpeg 9 as shipped. Dropping gst1-libav instead
# would take ffmpeg-backed decoding out of the Desktop's media path, which is what
# the plugin is for.
#
# Guarded with `#if LIBAVCODEC_VERSION_MAJOR < 63`, the file's own existing pattern
# for the same problem (LIBAVCODEC_VERSION_MAJOR < 61 guards AV_CODEC_ID_AYUV a few
# lines below). Carried on our own recipe, so patches/README.md rule 1 is not
# engaged: this is a fix in a recipe we author.
#
# Verified in the real flow, not by dry-run: gst1-libav-pengyos-dirclean + patch
# applies it, .applied_patches_list records it, and `make gst1-libav-pengyos` builds
# and installs libgstlibav.so, linked against libavcodec.so.63 (the fork).
closes = []
upstream_fixes = []
natural_fix = "whenever gst-libav drops the three removed codec IDs upstream; the guard is version-conditional, so a newer gst-libav that names them makes this patch fail loudly rather than silently"
expiry = "upstream gst-libav stops naming AV_CODEC_ID_V308/V408/V410 (check the filter in ext/libav/gstavvid{dec,enc}.c); the patch is deleted then. Ends sooner if ffmpeg re-adds the IDs, which makes the guard a no-op and the patch reversible"
observe_source = "pkg-stats"
upstream_status = "not-offered"


