[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-systemd-units"
version = "0.1.0"
description = "Core PengyOS systemd unit set + INI-style unit validator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "systemd", "units", "validator"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: System Boot",
]
# Runtime uses the standard library only; declare dev deps below.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pengyos_systemd_units*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
