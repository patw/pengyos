[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-secureboot-enroll"
version = "0.1.0"
description = "Sign and enrol the PengyOS Secure Boot chain (PK/KEK/db, UKI, systemd-boot, ESP lint)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "secure-boot", "uefi", "efi", "uki", "systemd-boot", "mok", "sbsign"]
# Standard library only at runtime. `pytest` is a dev-only dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-secureboot-enroll = "pengyos_secureboot_enroll.cli:main"

[tool.setuptools.packages.find]
include = ["pengyos_secureboot_enroll*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
