# This file is managed by pengyos-live. Do not edit by hand.
#
# Auto-login the live user (live) on the console getty for the
# live session. The [Service] ExecStart= line is cleared and replaced so
# getty logs the live user in directly.
[Service]
ExecStart=
ExecStart=-/sbin/getty --autologin live --noclear %I $BAUD
TTYVTXDiscard=1
TimeoutStartSec=0
