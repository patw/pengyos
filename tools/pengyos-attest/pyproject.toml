[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-attest"
version = "0.10.0"
description = "Tamper-evident, append-only hash-chained attestation log for PengyOS build and change events, with verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Pat Wendorf", email = "pat@catbee.ca" },
]
keywords = [
    "attest",
    "attestation",
    "hash-chain",
    "append-only",
    "audit",
    "tamper-evident",
    "pengyos",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Systems Administration",
]
# Standard library only. Declare any real dependency here.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pengyos-attest = "pengyos_attest.cli:main"

[project.urls]
Homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-attest"
Repository = "https://github.com/patw/pengyos"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_attest*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
