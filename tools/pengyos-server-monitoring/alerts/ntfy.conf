# PengyOS server-monitoring alert sink: ntfy (US-SRV-3).
#
# ntf.sh (ntfy) is a simple HTTP push-notification service: an alert is
# delivered by POSTing to a topic URL. This file configures the sink that the
# alert renderer (pengyos_monitoring.alerts) renders against.
#
# Format: INI-style `key = value` under a `[ntfy]` table. Blank lines and
# lines beginning with `#` are ignored. Keys are case-insensitive.
#
# The renderer never talks to the network in tests; it only renders the
# notification payload that *would* be POSTed (see alerts.py).

[ntfy]
# Base URL of the ntfy instance. A topic is appended by the renderer.
url = https://ntfy.sh
# Default topic alerts are posted to when a rule does not override it.
topic = pengyos-alerts
# Default message priority (1=lowest .. 5=highest; "default" is the middle).
# Maps critical -> urgent, warning -> high, info -> default.
default_priority = default
# Optional bearer token for a private/authenticated ntfy instance. Leave blank
# for the public instance (no auth).
auth_token =
# Optional comma-separated tags rendered as ntfy "tags" (emojis / badges).
tags = warning,alert
