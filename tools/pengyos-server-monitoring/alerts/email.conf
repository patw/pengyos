# PengyOS server-monitoring alert sink: email (US-SRV-3).
#
# Alerts are delivered by SMTP. This file configures the sink that the alert
# renderer (pengyos_monitoring.alerts) renders against. The renderer never
# opens an SMTP connection in tests; it only renders the message that *would*
# be sent (see alerts.py).
#
# Format: INI-style `key = value` under an `[email]` table. Blank lines and
# lines beginning with `#` are ignored. Keys are case-insensitive.

[email]
# SMTP server host.
smtp_host = mail.pengyos.example
# SMTP server port (587 = STARTTLS, 465 = SSL, 25 = cleartext).
smtp_port = 587
# Address alerts are sent FROM (required).
from = alerts@pengyos.example
# Comma-separated list of recipient addresses (required).
to = oncall@pengyos.example, ops@pengyos.example
# Optional SMTP username (omit for open relay / local MTA).
username =
# Optional SMTP password (omit for open relay / local MTA).
password =
# Optional subject prefix prepended to every rendered alert subject.
subject_prefix = [pengyos-alerts]
