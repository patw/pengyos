# PengyOS server-monitoring alert rules (US-SRV-3).
#
# Alert rules as data. Each [[rule]] is validated by
# pengyos_monitoring.rules (schema + grammar) and evaluated by
# pengyos_monitoring.evaluator over committed fixture series in fixtures/series/.
#
# Grammar (see pengyos_monitoring/rules.py):
#   expr := operand cmp_op number
#   operand := ratio("a", "b") | metric{labels}
#   cmp_op := < <= > >= == !=
#
# A rule fires when the comparison holds AND has held for the entire `for`
# window (sustained-for semantics).

[[rule]]
name        = "disk-low-free-ratio"
expr        = 'ratio("node_filesystem_free_bytes", "node_filesystem_size_bytes") < 0.10'
for         = "5m"
severity    = "critical"
summary     = "Free-space ratio below 10% for 5m; disk is filling."

[[rule]]
name        = "high-node-load"
expr        = 'ratio("node_load1", "node_num_cpu") > 1.5'
for         = "10m"
severity    = "warning"
summary     = "1-minute load above 1.5× CPU count for 10m."

[[rule]]
name        = "scrape-target-down"
expr        = 'up{job="node-exporter"} == 0'
for         = "2m"
severity    = "critical"
summary     = "node-exporter scrape target down for 2m."

[[rule]]
name        = "systemd-unit-failed"
expr        = "node_systemd_units_failed > 0"
for         = "5m"
severity    = "critical"
summary     = "One or more systemd units in failed state for 5m."
