[project]
name = "pengyos-server-monitoring"
version = "0.1.0"
description = "PengyOS server-monitoring (US-SRV-3): node-exporter + TheWatcher systemd units, Prometheus-style alert rules as data, and a fixture-driven rule evaluator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "monitoring", "prometheus", "alerting", "systemd", "node-exporter"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
# Keep the repo root importable so the evaluator module can be imported in tests
# without an editable install (stdlib-only, no network).
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
