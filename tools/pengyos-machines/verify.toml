# How this tool is tested (run by `scripts/pengyos_gate.py run --mode full`). Rust tool:
# the std-only logic (the tools' JSON, each button's command, the VNC client, the key map).
[[check]]
name = "unit tests"
run = ["cargo", "test", "-q"]
cwd = "tools/pengyos-machines"
expect = "exit0"
timeout = 900
