# Machines (pengyos-machines): the Desktop's window over pengyos-vm, distrobox,
# podman and Quadlet. The contract is spec.md.
#
# The decision logic (lib.rs: the tools' JSON, the command each button runs, the
# VNC protocol and the key map) is std + serde_json and `cargo test`-able with no
# display, no QEMU and no podman. The window is behind the `cosmic` feature,
# like pengyos-disks and pengyos-firmware.
[package]
name = "pengyos-machines"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pat Wendorf"]
description = "Machines: virtual machines, dev boxes and containers on the COSMIC desktop."

[features]
default = []
cosmic = ["dep:libcosmic"]

[lib]
name = "pengyos_machines"
path = "src/lib.rs"

[[bin]]
name = "pengyos-machines"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Same pinned libcosmic and feature set as the other PengyOS apps, so they all
# build from one cache (CARGO_TARGET_DIR=~/cosmic-build/install-gui).
[dependencies.libcosmic]
optional = true
git = "https://github.com/pop-os/libcosmic.git"
rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0"
features = ["about", "single-instance", "markdown", "qr_code", "wgpu", "xdg-portal"]
