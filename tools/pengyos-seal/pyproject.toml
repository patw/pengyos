[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-seal"
version = "0.1.0"
description = "Wire provenance into a pengyos-build output (sign -> name -> repro -> witness -> verify)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "reproducible", "reproducibility", "build", "witness", "sbom", "signature", "verifier"]
# Standard library only at runtime. `pytest` is a dev-only dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-seal = "pengyos_seal.cli:main"

[tool.setuptools.packages.find]
include = ["pengyos_seal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
