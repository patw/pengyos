[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengy-agent-package"
version = "0.1.0"
description = "PengyOS Buildroot external package (package/pengy/) for the PengyR agent (pengy-cli + pengy-web), validated by pytest."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf", email = "pat@catbee.ca" }]
# stdlib-only at test time; declare any real dependency here.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
