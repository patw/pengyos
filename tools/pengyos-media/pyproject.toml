[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-media"
version = "0.1.0"
description = "PengyOS media: build the live install medium (ISO/disk image) for an edition — live rootfs, installer, boot entry, as a deterministic plan plus an injectable executor."
readme = "README.md"
requires-python = ">=3.11"  # tests use tomllib; the live stick ships python3.11+
license = { text = "MIT" }
authors = [
    { name = "Pat Wendorf", email = "pat@catbee.ca" },
]
keywords = [
    "pengyos",
    "media",
    "live-usb",
    "iso",
    "squashfs",
    "xorriso",
    "efi",
    "installer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
# Standard library only. Declare any real dependency here.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pengyos-media = "pengyos_media.cli:main"

[project.urls]
Homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-media"
Repository = "https://github.com/patw/pengyos"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_media*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
