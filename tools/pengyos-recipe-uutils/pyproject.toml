[project]
name = "pengyos-recipe-uutils"
version = "0.1.0"
description = "PengyOS Buildroot recipe for uutils/coreutils, validated by tests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest >= 7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
