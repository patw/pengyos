[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-desktop-session"
version = "0.7.0"
description = "The COSMIC session + a VM-testable smoke matrix (US-DSK-1) for PengyOS Desktop: emit a deterministic greetd/cosmic-greeter/cosmic-session definition and check the session facts QEMU+OVMF can actually verify."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Pat Wendorf", email = "pat@catbee.ca" },
]
keywords = [
    "cosmic",
    "desktop-session",
    "greetd",
    "cosmic-greeter",
    "cosmic-session",
    "cosmic-comp",
    "wayland",
    "systemd",
    "pengyos",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Desktop Environments",
]
# Standard library only. Declare any real dependency here.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pengyos-desktop-session = "pengyos_desktop_session.cli:main"

[project.urls]
Homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-desktop-session"
Repository = "https://github.com/patw/pengyos"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_desktop_session*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
