[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-initramfs"
description = "Deterministic minimal initramfs builder for PengyOS (sorted, mtime-normalized gzip cpio)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["initramfs", "cpio", "reproducible", "pengyos"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]
# Version kept in sync with pengyos_initramfs/__init__.py (single source of truth).
dynamic = ["version"]
dependencies = []

[project.scripts]
pengyos-initramfs = "pengyos_initramfs.cli:main"

[project.urls]
Homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-initramfs"

[tool.setuptools.dynamic]
version = { attr = "pengyos_initramfs.__version__" }

[tool.setuptools.packages.find]
include = ["pengyos_initramfs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
