[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-propose-client"
version = "0.1.0"
description = "PengyOS propose-client — format change proposals and route them to the human approve gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "propose", "approve", "gate", "cli"]
dependencies = []

[project.scripts]
pengyos-propose = "pengyos_propose.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
