[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-installer"
version = "0.1.0"
description = "PengyOS installer: install PengyOS Core from the live stick to a target disk (GPT ESP + ext4 root), copying the running rootfs and wiring GRUB."
readme = "README.md"
requires-python = ">=3.11"  # tests use tomllib; the live stick ships python3.11+
license = { text = "MIT" }
authors = [
    { name = "Pat Wendorf", email = "pat@catbee.ca" },
]
keywords = [
    "pengyos",
    "installer",
    "disk",
    "gpt",
    "efi",
    "grub",
    "live-usb",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
# Standard library only. Declare any real dependency here.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pengyos-installer = "pengyos_installer.cli:main"

[project.urls]
Homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-installer"
Repository = "https://github.com/patw/pengyos"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_installer*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
