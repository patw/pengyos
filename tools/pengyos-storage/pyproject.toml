[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-storage"
version = "0.1.0"
description = "See where the disk went: a sorted, bar-charted, pie-charted du (stdlib-only, read-only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "storage", "disk", "du", "duf", "pie", "treemap", "visualizer", "linux"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# Runtime is standard library only — see spec.md "Constraints".
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-storage = "pengyos_storage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_storage*"]

[tool.pytest.ini_options]
# Keep the project root importable without an editable install, so the suite
# runs with no network, no root and no real disks.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
