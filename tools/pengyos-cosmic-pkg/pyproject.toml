[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-cosmic-pkg"
version = "0.1.0"
description = "Turn a git Rust component (URL + pinned tag + Cargo.lock) into a Buildroot cargo package with vendored crates — git-dependency aware."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["buildroot", "pengyos", "cosmic", "rust", "cargo", "vendoring", "reproducible"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pengyos-cosmic-pkg = "pengyos_cosmic_pkg.cli:main"

[tool.setuptools.packages.find]
include = ["pengyos_cosmic_pkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
