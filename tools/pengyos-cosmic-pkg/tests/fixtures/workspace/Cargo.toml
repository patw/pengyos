# Fixture workspace root manifest (demo data, not a real buildable workspace).
#
# The `vendor` subtask reads the paired Cargo.lock to find the git-sourced
# dependencies it must rewrite; this Cargo.toml documents what the root app is.
[workspace]
resolver = "2"

[package]
name = "cosmic-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay-clipboard = { git = "https://github.com/pop-os/smithay-clipboard", tag = "v0.6.0" }
serde = "1.0"
