[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-fleet-rollout"
version = "0.1.0"
description = "Plan, stage and roll back a PengyOS image/update rollout across a fleet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = [
    "pengyos",
    "fleet",
    "rollout",
    "image",
    "rollback",
    "canary",
    "linux",
    "reproducible",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# Runtime is stdlib-only; declare any real dependency here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-fleet-rollout = "pengyos_fleet_rollout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_fleet_rollout*"]

[tool.pytest.ini_options]
# Keep the project root importable without an editable install so the suite
# runs with no network, no root, and no real hardware.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
