# Committed inventory fixture for the pengyos-fleet-rollout test suite.
#
# A tiny fleet with a canary plus edge/core hosts, so the plan can be checked
# for canary-first ordering and batch grouping. This is the
# `pengyos-fleet-inventory` fleet description (hosts + role/priority) that the
# rollout consumes. Copy `../hosts.example.toml` for a ready-to-edit sample.
#
# Schema (a `[[hosts]]` array of tables):
#   name      (required) logical machine name; also the rollout target id.
#   role      (optional) the host's role, e.g. `canary` / `edge` / `core`.
#   priority  (optional) integer used to order within a tier; higher first.
#             Ties break on `name` so the plan is deterministic.
#   address   (optional) reachability target forwarded to the transport.

[[hosts]]
name = "canary-1"
role = "canary"
priority = 100
address = "canary-1.home.lab"

[[hosts]]
name = "core-1"
role = "core"
priority = 50
address = "core-1.home.lab"

[[hosts]]
name = "core-2"
role = "core"
priority = 50
address = "core-2.home.lab"

[[hosts]]
name = "edge-1"
role = "edge"
priority = 10
address = "edge-1.home.lab"

[[hosts]]
name = "edge-2"
role = "edge"
priority = 10
address = "edge-2.home.lab"
