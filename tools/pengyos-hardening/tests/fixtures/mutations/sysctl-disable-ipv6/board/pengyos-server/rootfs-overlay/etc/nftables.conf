#!/usr/sbin/nft -f
# nftables ruleset — PengyOS server edition (hardened).
# Baseline rule firewall/input-policy-deny: the input chain must default-deny.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy deny;
        # loopback + established are explicit, everything else is dropped.
        iif "lo" accept
        ct state established,related accept
    }

    chain forward {
        type filter hook forward priority 0; policy deny;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
