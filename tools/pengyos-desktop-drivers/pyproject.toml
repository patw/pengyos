[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-desktop-drivers"
version = "0.1.0"
description = "PengyOS desktop-drivers: generic (no vendor-accel) display/input/wifi kernel fragment + linux-firmware profile, with a linter."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "buildroot", "linux-firmware", "kernel-fragment", "kms", "wifi"]
# Runtime dependencies: none. The standard library is sufficient for emit/lint.
dependencies = []

[project.optional-dependencies]
# The test-suite runner. Declared so `pip install -e .[test]` is reproducible.
test = ["pytest>=7.0"]

[project.scripts]
pengyos-desktop-drivers = "pengyos_desktop_drivers.__main__:main"

[tool.setuptools]
packages = ["pengyos_desktop_drivers"]

[tool.setuptools.package-data]
pengyos_desktop_drivers = ["data/*"]

[tool.pytest.ini_options]
# Keep the suite hermetic: no network, no root, no display, no hardware.
# Opt-in integration tests live behind PENGYOS_IT=1 (see tests/test_integration.py).
testpaths = ["tests"]
addopts = "-ra"
