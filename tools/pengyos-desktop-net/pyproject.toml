[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-desktop-net"
version = "0.5.0"
description = "Declarative NetworkManager + wpa_supplicant + COSMIC panel defaults for the PengyOS Desktop, with a build-consumed emit/lint lane."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf", email = "dungeons@gmail.com" }]
keywords = ["pengyos", "networkmanager", "wifi", "cosmic", "buildroot"]
# Standard library only at test time; declare any real dependency here.
dependencies = []

[project.scripts]
# The emit/lint CLI (also runnable as ``python -m pengyos_desktop_net``).
pengyos-desktop-net = "pengyos_desktop_net.cli:main"

[project.optional-dependencies]
# Dev / test only. Never required to run the tool.
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
