# Flathub commit database — ref -> real OSTree commit hash.
#
# This is the committed data that resolving the UNPINNED commit placeholder
# resolves against. It is the
# offline, deterministic source of truth the resolution
# (`pengyos_desktop_curation.resolve`) uses to replace the `UNPINNED` commit
# placeholder in the emitted mirror manifest with a real Flathub commit before
# `pengyos-flatpak-mirror` syncs.
#
# HOW THE VALUES ARE POPULATED
# ----------------------------
# The real value for each ref is the *current* Flathub stable commit, which
# changes with every Flathub rebuild. This database is therefore a **cache**,
# populated by:
#
#   pengyos-desktop-curation emit --out DIR --refresh
#
# which fetches each ref's current commit from Flathub (the live boundary in
# `pengyos_desktop_curation.resolve.fetch_commit`) and rewrites this file. The
# mirror tool (`pengyos-flatpak-mirror`) may likewise refresh live at sync time.
#
# NOTE (2026-09-22): this environment has no network access to Flathub, so the
# values below are deterministic stand-ins (valid 64-hex OSTree-style commits,
# NOT real Flathub commits). They make the resolution path exercise end-to-end,
# but they MUST be replaced with real values via `--refresh` (or by hand) before
# a release, or the mirror will `flatpak update --commit=<this>` against a
# commit that does not exist on Flathub.

last_verified = "2026-09-22"

