[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-desktop-curation"
version = "0.7.0"
description = "Curated PengyOS Desktop default-app set as declarative data: emit a Flatpak ref list, a self-hosted-mirror manifest, and a coverage report against the US-DSK-2 everyday list."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Pat Wendorf", email = "dungeons@gmail.com" },
]
keywords = ["pengyos", "flatpak", "desktop", "curation", "mime", "flathub", "reproducible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
# Standard library only for the core. Declare any real dependency here.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pengyos-desktop-curation = "pengyos_desktop_curation.cli:main"

[project.urls]
Homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-desktop-curation"
Repository = "https://github.com/patw/pengyos"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_desktop_curation*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
