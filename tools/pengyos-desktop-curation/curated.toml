# Curated PengyOS Desktop default-application set.
#
# This is the *committed declarative data* for the curated default-app set,
# modelled as data
# (category -> app -> lane -> ref -> rationale -> human_signed).
#
# Human-ratified, never AI-decided (spec Principle 8): every entry below is
# authored by a human with an explicit `rationale` and is `human_signed = true`.
# The tool never chooses the app set unaided — it only stores and emits what a
# human has ratified.
#
# The delivery `lane` is one of:
#   flatpak   — shipped as a Flatpak (Flathub ref in `ref`)
#   appimage  — shipped as an AppImage
#   recipe    — built from a PengyOS/Buildroot recipe
#
# `ref` is only meaningful for the `flatpak` lane (the Flathub application id).
# For the other lanes it is omitted.

# --- browser ----------------------------------------------------------------

[[entry]]
category = "browser"
app = "Firefox"
lane = "flatpak"
ref = "org.mozilla.FirefoxRepo"
rationale = "The user-ratified default browser: standards-focused, privacy by default."
human_signed = true

