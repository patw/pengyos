# pengyos-tiers — default change-policy ruleset
#
# Each [[rule]] maps glob `path` patterns to a `tier`, optionally narrowed by
# `action` and/or `target`. Rules are evaluated in file order: the first
# match wins (so order == precedence — put the more specific / more critical
# rules first). A change that matches no rule is default-denied to Tier 2
# (fail safe). See spec.md for the authoritative schema.
#
# Tiers (SPEC §1.5):
#   0 = base/image        (nobody at runtime; rebuilt → signed → measured)
#   1 = agent-mutable     (config/services/bootloader entries/cmdline → agent-auto)
#   2 = critical surface  (bootloader binaries/keys/kernel/crypto → human-sign)
#
# Convention: Tier-2 (critical) rules are listed first. They are exceptions to
# the agent-mutable default, and because first-match wins they must precede any
# broader rule that would otherwise absorb the same path (e.g. `/etc/*`).

# ---------------------------------------------------------------------------
# Tier 2 — critical surface (human-sign). Fail-safe exceptions to Tier 1.
# ---------------------------------------------------------------------------

# Bootloader signing keys and EFI variable databases.
[[rule]]
tier = 2
path = [
  "/boot/efi/EFI/*/keys.*",
  "/boot/efi/EFI/*/shim*.p12",
  "/boot/efi/EFI/*/certs/*",
  "/boot/efi/EFI/*/db.*",
  "/boot/efi/EFI/*/secdb.*",
]
name = "bootloader signing keys / EFI databases are human-signed"

# Bootloader binaries (the .efi images themselves).
[[rule]]
tier = 2
path = [
  "/boot/efi/EFI/*/BOOT*.EFI",
  "/boot/efi/EFI/*/bootx64.efi",
  "/boot/efi/EFI/*/aa32efi.efi",
]
name = "bootloader binaries are human-signed"

# Kernel images and modules — the kernel itself is critical surface.
[[rule]]
tier = 2
path = [
  "/usr/lib/modules/*",
  "/boot/vmlinuz*",
  "/boot/initrd*",
  "/boot/initrd.img*",
]
name = "kernel images/modules are human-signed"

# Crypto / identity material and the agent's own trust root.
[[rule]]
tier = 2
path = [
  "/etc/secureboot/*",
  "/var/keys/*",
  "/var/lib/secureboot/*",
]
name = "crypto/identity material is human-signed"

# The update trust root and other explicitly-named critical targets.
[[rule]]
tier = 2
path = "/etc/pengyos/*"
target = "update-trust-root"
name = "the update trust root is human-signed"

# ---------------------------------------------------------------------------
# Tier 1 — agent-mutable (agent-auto). Pengy may change these freely; every
# mutation is snapshotted, journaled, and attested.
# ---------------------------------------------------------------------------

# Bootloader entries and kernel cmdline — the NVIDIA-style live fixes live here.
[[rule]]
tier = 1
path = [
  "/boot/efi/EFI/*/loader/entries/*",
  "/boot/loader/entries/*",
  "/boot/loader/args/*",
]
name = "bootloader entries/kernel cmdline are agent-mutable"

# System configuration files.
[[rule]]
tier = 1
path = "/etc/*"
name = "system configuration files are agent-mutable"

# Services (systemd units), both distro and local overrides.
[[rule]]
tier = 1
path = [
  "/usr/lib/systemd/system/*",
  "/etc/systemd/system/*",
]
name = "systemd units are agent-mutable"

# Driver configuration.
[[rule]]
tier = 1
path = [
  "/etc/modprobe.d/*",
  "/etc/hwprov/*",
  "/etc/udev/rules.d/*",
]
name = "driver configuration is agent-mutable"

# ---------------------------------------------------------------------------
# Anything matching none of the above falls through to the default-deny
# (Tier 2, human-sign). This is the fail-safe: unknown changes require a human.
# ---------------------------------------------------------------------------
