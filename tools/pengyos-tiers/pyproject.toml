[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-tiers"
version = "0.1.0"
description = "The 3-tier change policy engine for PengyOS (classify + gate changes by tier)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pengyos-tiers = "pengyos_tiers.cli:main"

[tool.setuptools.packages.find]
include = ["pengyos_tiers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
