[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-apparmor"
version = "0.1.0"
description = "Minimal, strict-by-default AppArmor profiles for PengyOS (incl. the pengy agent) plus a profile validator/lint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "apparmor", "security", "profiles", "linux", "reproducible"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# Runtime is stdlib-only; declare any real dependency here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-apparmor = "pengyos_apparmor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_apparmor*"]

[tool.pytest.ini_options]
# Keep the project root importable without an editable install so the suite
# runs with no network, no root, and no real kernel/AppArmor support.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
