# starship.toml — Starship prompt theme for the PengyOS server comfort set (US-SRV-1)
#
# A compact one-line prompt: user@host (shown over SSH or as root), the
# directory, git state, the language toolchains in use, and a ❯ that turns red
# when the last command failed. No module here reaches the network, and
# starship itself has no telemetry (there is no `telemetry` key to set — an
# earlier version set one, and starship warned about it on every prompt).
#
# Every key is checked against the shipped starship: tests run
# `starship print-config` / `starship prompt` on this file and fail on any
# warning or parse error (tools/pengyos-server-toolset/tests/test_shell.py).
#
# Load it from your profile:
#     eval "$(starship init bash)"   # or zsh
# or source the profile, which does this when `starship` is on PATH.

add_newline = false
format = """
$username$hostname$directory$git_branch$git_status$python$nodejs$golang$rust$cmd_duration$character"""

[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style)"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "green"

[directory]
style = "cyan bold"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$symbol$branch]($style) "

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"

[cmd_duration]
min_time = 5_000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
