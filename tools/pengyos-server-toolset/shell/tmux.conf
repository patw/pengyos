# tmux.conf — tmux defaults for the PengyOS server comfort set (US-SRV-1)
#
# Sane remote-admin defaults: truecolor, a comfortable prefix, mouse support, a
# useful status line and copy-mode keybindings. NO telemetry / no network.
#
# Load it with:  tmux -f shell/tmux.conf
# or symlink it to ~/.tmux.conf and restart tmux.

# --- base ------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
set -g escape-time 0

# --- colour ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g aggressive-resize on

# --- convenience -----------------------------------------------------------
set -g mouse on
set -g status-on-resize on

# Prefix is C-b (keep the muscle memory); C-a still remaps inside.
set -g prefix C-b
bind-key C-a send-prefix

# Reload this file without restarting:  prefix + r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Panes: split with the familiar | and -
bind-key v split-window -vertical
bind-key h split-window -horizontal
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Copy mode: vi-style, paste into the system clipboard when available.
setw -g mode-keys vi
bind-key y copy-pipe-and-cancel "command -v pbcopy >/dev/null 2>&1 && pbcopy || xclip -selection clipboard"
bind-key -o V split-window -vertical
bind-key -o H split-window -horizontal

# --- status line -----------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-format[0] "#[fg=#7aa2f7,bold] #S #[fg=default]#I:#A"
set -g status-left "#[fg=#bb9af7] #S "
set -g status-right "#[fg=default]%Y-%m-%d #[fg=default]%H:%M"

# --- misc ------------------------------------------------------------------
set -g history-limit 50000
set -g monitor-interval 0
set -g renumber-windows on
