# Example WireGuard spec for `pengyos-netctl wg --spec wg.example.yaml --out wg/`.
#
# `key_dir` is where key files live (resolved relative to this file when
# the path is not absolute). A peer's `private_key` is optional: when
# omitted the generator allocates one from `key_dir/<name>.private`.
#
# Private keys are chmod 0600 and NEVER written into any rendered output
# other than the config that belongs to their owner (the server's private
# key goes only in wg0.conf; each peer's private key only in that peer's
# config). This file references key files that the `wg` task generates.

key_dir: keys

server:
  private_key: server.private   # generated as keys/server.private
  address: "10.8.0.1/24"
  listen_port: 51820
  dns: "10.8.0.1"

peers:
  - name: alice
    address: "10.8.0.2/24"
    private_key: alice.private
    allowed_ips: ["10.8.0.2/32"]
  - name: bob
    address: "10.8.0.3/24"
    # no private_key here -> the generator allocates keys/bob.private
