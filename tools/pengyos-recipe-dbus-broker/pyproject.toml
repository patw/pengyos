[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-recipe-dbus-broker"
version = "0.1.4"
description = "PengyOS Buildroot recipe (Config.in + .mk + .hash) for dbus-broker, as the system D-Bus bus, validated by pytest."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf", email = "dungeons@gmail.com" }]
# stdlib-only at test time; declare any real dependency here.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
