# Example host list for `pengyos-fleet collect`.
#
# Copy to `hosts.toml` and edit. `collect` writes one `profile.toml` per host
# under `profiles/<name>/`.
#
# Schema:
#   name      (required) logical machine name; also the output directory name.
#   address   (required) SSH target — a bare host, or `user@host`.
#   fixtures  (optional) directory of command-output fixtures. The mock runner
#             reads one file per command, named after the command's basename
#             (e.g. `lscpu` -> `<fixtures>/lscpu`). Relative paths resolve
#             against this file's directory. Omit for an SSH-only host.

[[hosts]]
name = "n1"
address = "n1.home.lab"
fixtures = "tests/fixtures/hosts/n1"

[[hosts]]
name = "n2"
address = "n2.home.lab"
fixtures = "tests/fixtures/hosts/n2"
