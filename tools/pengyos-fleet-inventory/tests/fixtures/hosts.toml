# Sample host list for the pengyos-fleet test suite.
#
# Relative `fixtures` paths are resolved against this file's directory
# (tests/fixtures/), so this list is portable. `collect` writes one
# profile.toml per host under profiles/<name>/.

[[hosts]]
name = "n1"
address = "n1.home.lab"
fixtures = "hosts/n1"

[[hosts]]
name = "n2"
address = "n2.home.lab"
fixtures = "hosts/n2"
