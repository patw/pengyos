# File Sharing (pengyos-sharing): share folders with the other computers on the
# network, over SMB, from the COSMIC desktop. A window over `pengyos-shares`,
# which does the work as root (ksmbd, the share passwords, the firewall).
#
# The decision logic (lib.rs) is std + serde_json and fully `cargo test`-able
# without a display or root. The window is behind `cosmic` (libcosmic), off by
# default — the same shape as pengyos-firmware and pengyos-printers.
[package]
name = "pengyos-sharing"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pat Wendorf"]
description = "File Sharing: share folders on the network (SMB) from the COSMIC desktop."

[features]
default = []
cosmic = ["dep:libcosmic"]

[lib]
name = "pengyos_sharing"
path = "src/lib.rs"

[[bin]]
name = "pengyos-sharing"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Same pinned libcosmic and feature set as the other tools/ apps, so all of them
# build from one cache (CARGO_TARGET_DIR=~/cosmic-build/install-gui).
[dependencies.libcosmic]
optional = true
git = "https://github.com/pop-os/libcosmic.git"
rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0"
features = ["about", "single-instance", "markdown", "qr_code", "wgpu", "xdg-portal"]
