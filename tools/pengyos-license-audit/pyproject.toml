[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-license-audit"
version = "0.1.0"
description = "Verify PengyOS component license claims and enforce the freedom policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "license", "audit", "spdx", "freedom", "reproducible"]
# Standard library only at runtime — no third-party runtime deps.
dependencies = []

[project.optional-dependencies]
# Dev/test extras. Not required to run the tool, only to develop it.
test = ["pytest>=7.0"]

[project.scripts]
pengyos-license-audit = "pengyos_license_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_license_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
