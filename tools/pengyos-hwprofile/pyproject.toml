[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-hwprofile"
version = "0.4.0"
description = "Detect hardware and emit a declarative, version-controllable per-machine profile for PengyOS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "hardware", "profile", "linux", "reproducible"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# Runtime is stdlib-only; declare any real dependency here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-hwprofile = "pengyos_hwprofile.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_hwprofile*"]

[tool.pytest.ini_options]
# Keep the project root importable without an editable install so the suite
# runs with no network, no root, and no real hardware.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
