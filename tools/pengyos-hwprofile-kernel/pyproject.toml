[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-hwprofile-kernel"
version = "0.1.0"
description = "Turn a pengyos-hwprofile hardware profile into a minimal kernel fragment set + defconfig fragment for PengyOS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "hwprofile", "kernel", "fragments", "defconfig", "reproducible"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# Runtime is stdlib-only; declare any real dependency here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-hwprofile-kernel = "pengyos_hwprofile_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_hwprofile_kernel*"]

[tool.pytest.ini_options]
# Keep the project root importable without an editable install so the suite
# runs with no network, no root, and no real hardware.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
