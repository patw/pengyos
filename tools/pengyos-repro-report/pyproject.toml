[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-repro-report"
version = "0.1.0"
description = "Rebuild-and-compare reproducibility report for PengyOS build outputs (witness layout)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "reproducible", "reproducibility", "build", "witness", "diff"]
# Standard library only at runtime. `pytest` is a dev-only dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-repro-report = "pengyos_repro_report.cli:main"

[tool.setuptools.packages.find]
include = ["pengyos_repro_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
