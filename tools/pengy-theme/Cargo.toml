[package]
name = "pengy-theme"
version = "0.5.1"
edition = "2021"
description = "Theme & desktop-defaults packager/validator for PengyOS: validate a theme manifest, check contrast/consistency, and emit installable artifacts + a hash."
license = "MIT"
readme = "README.md"
repository = "https://github.com/patw/pengyos"
keywords = ["pengyos", "theme", "contrast", "wcag", "packager"]
categories = ["command-line-utilities", "config"]

# A single package builds both the reusable library (`pengy_theme`) and the
# CLI binary (`pengy-theme`). The binary is thin: parse args, call the library.
#
# This scaffold is intentionally dependency-free (standard library only) so the
# suite builds offline with no network. Per-subtask dependencies (a TOML parser
# for the manifest, a SHA-256 for the pack hash) are declared here when
# needed — never inline.
[lib]
name = "pengy_theme"
path = "src/lib.rs"

[[bin]]
name = "pengy-theme"
path = "src/main.rs"

# Per-subtask dependency: the theme manifest is TOML, so the schema module
# (src/manifest.rs) parses it with the `toml` crate, and the schema types derive
# serde. Declared here (never inline) so the dependency graph is explicit and
# reproducible. Both crates are vendored in the offline registry cache.
[dependencies]
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.0"
toml = "0.8"

[dev-dependencies]

[profile.release]
# Deterministic, reproducible-friendly release builds.
lto = "thin"
