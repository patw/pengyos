[project]
name = "pengyos-recipe-server-clis"
version = "0.1.0"
description = "PengyOS Buildroot recipes for the Server comfort CLIs (zoxide, sd, node_exporter, btop, helix, neovim)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest >= 7.0"]

[project.scripts]
# The CLI documented in README.md / spec.md "Interface": installable as
# `pengyos-recipe-server-clis list|emit|lint`. The implementation lives in
# `pengyos_recipe_server_clis.emit` (build_parser + main); __main__.py mirrors
# this so `python -m pengyos_recipe_server_clis` works too.
pengyos-recipe-server-clis = "pengyos_recipe_server_clis.emit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
