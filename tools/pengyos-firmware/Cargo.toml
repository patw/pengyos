# PengyOS Firmware — the desktop side of fwupd: an app that shows which devices
# have a firmware update waiting and installs what the user asks for, plus a
# session notifier that says so when (and only when) the user wants to hear it.
#
# The decision logic (lib.rs) is std + serde_json and fully `cargo test`-able
# without a display, a session bus, the daemon or the network. The libcosmic
# window and the D-Bus notifier are behind the `cosmic` feature (off by default),
# like pengyos-updates and pengyos-disks.
[package]
name = "pengyos-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pat Wendorf"]
description = "Firmware: see and apply fwupd updates on the COSMIC desktop."

[features]
default = []
cosmic = ["dep:libcosmic", "dep:zbus"]

[lib]
name = "pengyos_firmware"
path = "src/lib.rs"

[[bin]]
name = "pengyos-firmware"
path = "src/main.rs"

[dependencies]
serde_json = "1"
zbus = { version = "5", optional = true }

# Same pinned libcosmic and feature set as pengyos-install-gui, pengyos-updates
# and pengyos-disks, so all four build from one cache
# (CARGO_TARGET_DIR=~/cosmic-build/install-gui).
[dependencies.libcosmic]
optional = true
git = "https://github.com/pop-os/libcosmic.git"
rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0"
features = ["about", "single-instance", "markdown", "qr_code", "wgpu", "xdg-portal"]
