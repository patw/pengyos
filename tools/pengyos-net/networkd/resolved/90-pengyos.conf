# PengyOS baseline for systemd-resolved.
#
# Install to: /etc/systemd/resolved.conf.d/90-pengyos.conf
# (drop-in on top of the distribution's /etc/systemd/resolved.conf)
#
# systemd-networkd supplies per-link DNS servers (see 10-default.network:
# DHCPv4/UseDNS and IPv6AcceptRA/UseDNS); this drop-in only pins the
# resolver's own behaviour.
[Resolve]
# Keep the default stub listener so local applications that hard-code
# 127.0.0.53 (or /etc/resolv.conf pointing at it) keep working.
DNSStubListener=yes
# Refuse DNS queries from non-local (non-localhost) peers. A desktop
# resolver is not a LAN resolver; the baseline must not expose DNS to
# other hosts.
DNSStubListenerExtra=
CacheFromNetwork=no
# Do not leak mDNS queries for unicast .local names.
ResolveUnicastSingleLabel=no

[DNS]
# Per-link DNS from DHCP/RA (10-default.network) is the source of truth.
# FallbackDNS is used ONLY when no link provides DNS at all (e.g. the
# offline dummy interface). It mirrors systemd's built-in default, pinned
# explicitly so the baseline does not silently depend on a distro patch.
# Note: this must never be 127.0.0.53 -- that is the stub listener
# itself and would loop.
FallbackDNS=1.1.1.1 9.9.9.9 8.8.8.8
