[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-kernel-fragments"
version = "0.1.0"
description = "PengyOS kernel config fragments + a validate/compose/explain composer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["kernel", "kconfig", "fragments", "buildroot", "pengyos", "reproducible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
# Standard library only. No runtime dependencies.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pengyos-kernel-fragments = "pengyos_kernel_fragments.cli:main"

[tool.setuptools]
packages = ["pengyos_kernel_fragments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
