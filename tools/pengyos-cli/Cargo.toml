[package]
name = "pengyos-cli"
version = "0.1.0"
edition = "2021"
description = "The pengyos meta-CLI: one entry point over the PengyOS tools (build, verify, triage, profile, sbom, doctor)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/patw/pengyos"
keywords = ["pengyos", "cli", "meta-cli", "distro", "catbee"]
categories = ["command-line-utilities"]

# A single package builds both the reusable library (`pengyos_cli`) and the
# CLI binary (`pengyos`). The library holds the version, the documented
# subcommand surface, and (later subtasks) the dispatch framework + config
# loading so the thin binary stays thin.
[lib]
name = "pengyos_cli"
path = "src/lib.rs"

[[bin]]
name = "pengyos"
path = "src/main.rs"

# The scaffold is standard-library only on purpose: it must build and test fully
# offline (no network at test time). Any dependency is declared here, added
# per-subtask.

[dependencies]

[dev-dependencies]
