[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-mutations"
version = "0.5.0"
description = "Journaled, reversible system changes for PengyOS: snapshot -> apply -> record -> revert -> converge."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "mutations", "snapshot", "revert", "attest", "declarative"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
pengyos-mutations = "pengyos_mutations.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pengyos_mutations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
