# The PengyOS dev box — shipped in the image as
# /usr/share/pengyos/guests.d/dev.toml (Server and Desktop).
#
#   pengyos-guest enter dev              # a shell; created on first use
#   pengyos-guest enter dev -- make -j8  # one command
#
# Your home directory is the same inside and out, so a repo in ~/src builds in
# the box and is edited on the host. apt, pip, cargo and make all work as on
# Ubuntu; the host stays untouched. To change it, copy this table into
# ~/.config/pengyos/guests.toml (yours wins by name), then
# `pengyos-guest destroy dev` and enter it again.

[guests.dev]
description = "Ubuntu 24.04 build box: compilers, cmake, git, go, rust, uv"
image = "docker.io/library/ubuntu:24.04"
packages = [
  "build-essential", "cmake", "ninja-build", "pkg-config", "git", "curl",
  "wget", "ca-certificates", "python3", "python3-venv", "golang", "zsh",
]
# Runs as you inside the box, after the packages, on every apply: keep each
# step idempotent. rustup installs into ~/.cargo; uv into the box's /usr/local.
setup = [
  # PATH for the toolchains below, in the box only (/etc is the box's own; your
  # shared ~/.bashrc and ~/.zshrc stay untouched, so the host PATH does not
  # change). One file holds it; bash login shells read it through profile.d, and
  # zsh — the PengyOS shell, which never reads /etc/profile — through zshenv,
  # the one system file every zsh sources. The zshenv line is appended once
  # (guarded by its own marker), since setup runs on every apply.
  "echo 'case \":$PATH:\" in *\":$HOME/.cargo/bin:\"*) ;; *) export PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$PATH\" ;; esac' | sudo tee /etc/pengyos-dev-path.sh >/dev/null",
  "echo '. /etc/pengyos-dev-path.sh' | sudo tee /etc/profile.d/pengyos-dev.sh >/dev/null",
  "grep -q pengyos-dev-path /etc/zsh/zshenv 2>/dev/null || { sudo mkdir -p /etc/zsh && echo '. /etc/pengyos-dev-path.sh' | sudo tee -a /etc/zsh/zshenv >/dev/null; }",
  "command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path",
  # rustup can be there with no toolchain chosen (a ~/.cargo from an earlier or a
  # host install: home is shared), and then every rustc/cargo errors "no default is
  # configured". The step above skips in that case, so pick stable when none is set.
  "rustup default >/dev/null 2>&1 || rustup default stable",
  # uv into the box's own /usr/local/bin, not the shared ~/.local/bin: the host
  # ships its own uv (26.11), and ~/.local/bin comes first on the host's PATH.
  "command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sudo env UV_UNMANAGED_INSTALL=/usr/local/bin sh",
]
# What this box promises, checked after setup on every apply: each must succeed,
# and apply prints the version it found (or fails, naming the command).
verify = [
  "gcc --version", "cmake --version", "ninja --version", "go version",
  "rustc --version", "cargo --version", "uv --version",
  # sudo without a password (distrobox's NOPASSWD rule for a rootless box): the
  # setup steps above use it, and an agent in the box cannot answer a prompt.
  "sudo -n true && echo sudo: no password needed",
]
