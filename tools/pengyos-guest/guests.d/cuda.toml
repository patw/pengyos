# The CUDA dev box — shipped only in NVIDIA images as
# /usr/share/pengyos/guests.d/cuda.toml.
#
#   pengyos-guest enter cuda -- nvidia-smi
#
# The host's NVIDIA driver is shared into the box (`nvidia = true`), so the
# CUDA toolkit here must be no newer than the driver supports (595 -> 13.1).
# Build llama.cpp and friends here; run the binaries here or on the host.

[guests.cuda]
description = "CUDA 13.1 toolkit on Ubuntu 24.04, host NVIDIA driver shared"
image = "docker.io/nvidia/cuda:13.1.0-devel-ubuntu24.04"
nvidia = true
packages = ["build-essential", "cmake", "ninja-build", "git", "curl", "ca-certificates", "python3", "python3-venv"]
setup = [
  # PATH for the toolchains below, in the box only (/etc is the box's own; your
  # shared ~/.bashrc stays untouched, so the host PATH does not change).
  "echo 'export PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$PATH\"' | sudo tee /etc/profile.d/pengyos-dev.sh >/dev/null",
  "command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh",
]
