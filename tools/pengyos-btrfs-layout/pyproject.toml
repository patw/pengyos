[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-btrfs-layout"
version = "0.1.0"
description = "PengyOS btrfs-layout: plan a btrfs subvolume layout and generate create/snapshot/rollback commands (btrfs calls are mockable)."
readme = "README.md"
# >=3.11: the layout.toml round-trip parses with the stdlib's read-only
# TOML reader (tomllib). No third-party dependencies.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = [
    "btrfs",
    "subvolume",
    "snapshot",
    "rollback",
    "pengyos",
    "reproducible",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Filesystems",
]
# Standard library only. No runtime dependencies.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
pengyos-btrfs = "pengyos_btrfs.cli:main"

[tool.setuptools]
packages = ["pengyos_btrfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
