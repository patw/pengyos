# Cargo workspace root for pengy-panel.
#
# The workspace is split so the headless-testable core (`widgets`) never depends
# on the Wayland rendering backend that lives in the `pengy-panel` binary.
# See ARCHITECTURE.md for the full rationale.
[workspace]
resolver = "2"
members = ["widgets", "pengy-panel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pat Wendorf <dungeons@gmail.com>"]
repository = "https://github.com/patw/pengyos"
homepage = "https://github.com/patw/pengyos/tree/main/tools/pengy-panel"
description = "A fast, low-memory pure-Rust Wayland layer-shell status bar."

[workspace.dependencies]
widgets = { path = "widgets" }

# A status bar lives on screen forever, so keep the release artifact small and
# its steady-state memory low. See the "Memory & performance" section of
# ARCHITECTURE.md.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
