[package]
name = "pengy-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust Wayland layer-shell status bar (binary: CLI, config, rendering backend)."
readme = "../README.md"

# The binary is the only crate allowed to touch a compositor. Everything
# headless-testable lives in the `widgets` core — see ARCHITECTURE.md for the
# dependency-direction rule.
[dependencies]
widgets = { workspace = true }
# Config-file support (task 5). These live in the BINARY crate on purpose:
# the `widgets` core stays dependency-free so its test boundary holds (see
# ARCHITECTURE.md). `serde` derives the wire structs; `toml` parses panel.toml
# text into them. The core only ever sees the validated `PanelConfig` model.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# The real Wayland `layer-shell` backend (task 11). These live in the BINARY
# crate on purpose (the `widgets` core stays dependency-free). `wayland-client`
# is the client-side protocol runtime; `wayland-protocols` provides the
# `layer-shell` bindings; `wayland-backend` provides the shm (shared-memory)
# buffer allocation used to draw the bar. None of this is linked into `cargo
# test`/`--print-layout`; only the `PENGYOS_IT=1`-gated integration path uses it.
wayland-client = "0.31"
# `layer-shell` is a wlroots protocol: it lives in `wayland-protocols-wlr`
# (the wlr-protocols bindings), *not* in `wayland-protocols`. The `client`
# feature turns on the client-side generated bindings. `wayland-protocols`
# (also `client`) is a transitive requirement of wlr's `layer-shell` (it
# references the xdg-shell `xdg_popup` interface) and gives us the core
# `wl_shm`/`wl_output` client types. The `staging` feature adds
# `wp_fractional_scale_manager_v1` (fractional-scale-v1, task 14) — output
# scale beyond integers.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend = "0.3"
# `libc::poll` gives us a bounded blocking wait on the Wayland socket fd for
# `Backend::wait(timeout)` (the wayland crates expose an fd but no timed wait).
libc = "0.2"
