[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pengyos-witness-bundle"
version = "0.1.0"
description = "Present a pengyos-build output in the canonical witness layout and verify its SBOM signature."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf" }]
keywords = ["pengyos", "sbom", "witness", "spdx", "cyclonedx", "reproducible"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Build Tools",
]
# Runtime dependencies: none. This tool is stdlib-only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pengyos-witness-bundle = "pengyos_witness_bundle.cli:main"

[tool.setuptools]
packages = ["pengyos_witness_bundle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
