# Example backup planner config for pengyos-backup.
#
# This is a *reference* document describing the backup.yaml schema. Copy it to
# `backup.yaml` and adjust it for your host. `pengyos-backup plan`, `render`,
# and `verify-restore` all consume this shape; see `pengyos_backup/config.py`
# for the authoritative schema and validation rules.

version: 1

# --- sources -------------------------------------------------------------
# Host-relative or absolute paths to back up. Non-empty list of strings.
sources:
  - /etc
  - /home
  - /var/lib/pengyos

# --- targets -------------------------------------------------------------
# One or more backup repositories. At least one of `local` / `remote` is
# required.
targets:
  # A local repository: the directory on this host that holds the restic/rustic
  # repo. `path` is required and must be a non-empty string.
  local:
    path: /var/backups/pengyos

  # A remote repository: a restic/rustic repository URL (s3:, b2:, rest:, ...).
  # `url` is required. `host` (optional) is the restic "host" tag used to
  # disambiguate snapshots taken from different machines.
  remote:
    url: s3:example.com/pengyos
    host: backup-host

# --- schedule ------------------------------------------------------------
# systemd OnCalendar syntax for the emitted timer.
schedule:
  on_calendar: "Mon..Fri *-*-* 02:30:00"
  # Optional; maps onto the systemd RandomizedDelaySec timer option
  # (avoids thundering-herd wakeups).
  randomized_delay: "10min"

# --- retention -----------------------------------------------------------
# Prune/keep policy. These map onto restic/rustic `prune` flags
# (--keep-last, --keep-daily, --keep-weekly, --keep-monthly, --keep-yearly,
# --keep-within). Every field is optional individually, but at least one keep
# value must be > 0 — a policy that keeps zero snapshots is rejected by the
# planner (see pengyos_backup/config.py). An absent retention is a valid
# keep-all `forget --prune`.
retention:
  keep_last: 7
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6
  keep_yearly: 0
  keep_within: "720h"
