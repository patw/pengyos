# PengyOS Hardware Monitor (pengyos-hwmon)
#
# Front-ends to the HWall collectors: temperatures, fans, voltages, clocks,
# utilization, power and storage health, in one dense table with current/min/max
# columns. The libcosmic window (Desktop) adds a per-sensor warning/critical
# threshold editor; the ratatui terminal view (Server, ssh) is the cut-down one.
#
# Layout follows the other in-tree apps (pengyos-updates, pengyos-install-gui):
#   * the collection and formatting live in hwall-core / hwall-app (upstream
#     HWall, MIT, pinned by commit below) - untouched, not forked;
#   * libcosmic is behind the `cosmic` feature, so a plain `cargo test`/`cargo
#     build` needs no display and no libcosmic checkout;
#   * the terminal view is behind the `tui` feature (ratatui, no libcosmic);
#   * `--check` prints one collection pass as text and works without either.
#
# Built by scripts/build-cosmic.sh: `cosmic,tui` into $PENGYOS_COSMIC_BUILD/install-gui
# (the Desktop binary, sharing the other apps' libcosmic build) and `tui` alone
# into $PENGYOS_COSMIC_BUILD/hwmon-tui (the Server binary).

[package]
name = "pengyos-hwmon"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Pat Wendorf"]
description = "PengyOS Hardware Monitor: sensors, fans, power and clocks (COSMIC window and terminal view)."
repository = "https://github.com/patw/pengyos"
homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-hwmon"

[features]
default = []
# The libcosmic GUI. Off by default so the crate builds and tests anywhere.
cosmic = ["dep:libcosmic"]
# The terminal view (Server image, ssh, the Linux console). The Desktop build
# turns both on, so `pengyos-hwmon --tui` works in a terminal there too.
tui = ["dep:ratatui"]

[[bin]]
name = "pengyos-hwmon"
path = "src/main.rs"

[dependencies]
# Upstream HWall's collection library and application policy: read-only sysfs +
# the standard helper tools (sensors, smartctl, nvme, ethtool, dmidecode).
# Pinned by commit; HWall is MIT, see LICENSE and THIRD-PARTY.md.
hwall-core = { git = "https://github.com/pulpul-s/HWall", rev = "500cc4599254061bab93d116f9b30e0e6529fd4e" }
hwall-app = { git = "https://github.com/pulpul-s/HWall", rev = "500cc4599254061bab93d116f9b30e0e6529fd4e" }

# Reads `pengyos-fans status --json` for the Fans view. Already in the tree
# through hwall-app, so the lock gains no new crate.
serde_json = "1"

# The terminal front-end. Same ratatui/crossterm as HWall's own CLI at the
# pinned commit; no default features, so no extra backends are compiled in.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"], optional = true }

# Same pinned libcosmic as the other in-tree apps, so all of them share one
# libcosmic build in CARGO_TARGET_DIR=~/cosmic-build/install-gui.
[dependencies.libcosmic]
optional = true
git = "https://github.com/pop-os/libcosmic.git"
rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0"
features = [
    "dbus-config",     # theme/config subscription, so it follows the COSMIC theme
    "single-instance",
    "tokio",
    "wgpu",            # GPU rendering: software raster was ~57% of a core while scrolling
    "wayland",
]

[profile.release]
lto = true
strip = true
