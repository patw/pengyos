# PengyOS Hardware Monitor (pengyos-hwmon)
#
# Front-ends to the HWall collectors: temperatures, fans, voltages, clocks,
# utilization, power and storage health, in one dense table with current/min/max
# columns. The libcosmic window (Desktop) adds a per-sensor warning/critical
# threshold editor; the ratatui terminal view (Server, ssh) is the cut-down one.
#
# Layout follows the other in-tree apps (pengyos-updates, pengyos-install-gui):
#   * the collection and formatting live in hwall-core / hwall-app (upstream
#     HWall, MIT, pinned by commit below) - untouched, not forked;
#   * libcosmic is behind the `cosmic` feature, so a plain `cargo test`/`cargo
#     build` needs no display and no libcosmic checkout;
#   * the terminal view is behind the `tui` feature (ratatui, no libcosmic);
#   * `--check` prints one collection pass as text and works without either.
#
# Built by scripts/build-cosmic.sh: `cosmic,tui` into $PENGYOS_COSMIC_BUILD/install-gui
# (the Desktop binary, sharing the other apps' libcosmic build) and `tui` alone
# into $PENGYOS_COSMIC_BUILD/hwmon-tui (the Server binary).

[package]
name = "pengyos-hwmon"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Pat Wendorf"]
description = "PengyOS Hardware Monitor: sensors, fans, power and clocks (COSMIC window and terminal view)."
repository = "https://github.com/patw/pengyos"
homepage = "https://github.com/patw/pengyos/tree/main/tools/pengyos-hwmon"

[features]
default = []
# The libcosmic GUI. Off by default so the crate builds and tests anywhere.
cosmic = ["dep:libcosmic"]
# The terminal view (Server image, ssh, the Linux console). The Desktop build
# turns both on, so `pengyos-hwmon --tui` works in a terminal there too.
tui = ["dep:ratatui"]

[[bin]]
name = "pengyos-hwmon"
path = "src/main.rs"

[dependencies]
# Upstream HWall's collection library and application policy: read-only sysfs +
# the standard helper tools (sensors, smartctl, nvme, ethtool, dmidecode).
# Pinned by commit; HWall is MIT, see LICENSE and THIRD-PARTY.md.
hwall-core = { git = "https://github.com/pulpul-s/HWall", rev = "500cc4599254061bab93d116f9b30e0e6529fd4e" }
hwall-app = { git = "https://github.com/pulpul-s/HWall", rev = "500cc4599254061bab93d116f9b30e0e6529fd4e" }

# Reads `pengyos-fans status --json` for the Fans view. Already in the tree
# through hwall-app, so the lock gains no new crate.
serde_json = "1"

# The terminal front-end. Same ratatui/crossterm as HWall's own CLI at the
# pinned commit; no default features, so no extra backends are compiled in.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"], optional = true }

# Same pinned libcosmic rev as the other in-tree apps. With the `applet` feature
# and the [patch] below it is a separate build of that rev in
# CARGO_TARGET_DIR=~/cosmic-build/install-gui, not the one the other apps share.
[dependencies.libcosmic]
optional = true
git = "https://github.com/pop-os/libcosmic.git"
rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0"
features = [
    "dbus-config",     # theme/config subscription, so it follows the COSMIC theme
    "single-instance",
    "applet",          # the Fans panel applet (--applet)
    "tokio",
    "wgpu",            # GPU rendering: software raster was ~57% of a core while scrolling
    "wayland",
]

[profile.release]
lto = true
strip = true

# The `applet` feature makes libcosmic depend on cosmic-panel-config, which asks
# for cosmic-config from libcosmic's default branch: a second, unpinned copy of
# libcosmic's crates next to the pinned ones. Every libcosmic crate is pointed at
# the pinned rev here, as PengyOS does for COSMIC's own applets (the "//" makes
# the URL differ from the one patched, which cargo requires), so there is one
# copy of each. Keep the rev equal to [dependencies.libcosmic]'s.
[patch."https://github.com/pop-os/libcosmic"]
build_helpers = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
cosmic-config = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
cosmic-config-derive = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_accessibility = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_core = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_debug = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_futures = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_graphics = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_program = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_renderer = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_runtime = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_wgpu = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_widget = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
iced_winit = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }
libcosmic = { git = "https://github.com/pop-os/libcosmic//", rev = "03d7dcb832bc6d15bc1bb07327a1aa426b2d5bc0" }

# cosmic-panel-config (for the applet) at the commit of the cosmic-panel the
# image ships (scripts/cosmic-components.tsv), so the applet reads the panel's
# config the way that panel writes it.
[patch."https://github.com/pop-os/cosmic-panel"]
cosmic-panel-config = { git = "https://github.com/pop-os/cosmic-panel//", rev = "ca20ce3185b3b4404f429d59d429c40b58a2ddef" }
