# How this tool is tested (run by `scripts/pengyos_gate.py run --mode full`).
# The suite drives the shipped script against a sandbox root (--root DIR) holding
# /etc/passwd, /etc/hostname and home directories, with fake sshd and systemctl
# first on PATH, so it needs no root, no sshd and no build.
[[check]]
name = "unit tests"
run = ["python3", "-m", "pytest", "-q"]
cwd = "tools/pengyos-ssh-password"
expect = "exit0"
timeout = 300
