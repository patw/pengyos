# How this tool is tested (run by `scripts/pengyos_gate.py run --mode full`). Rust tool:
# the library (catalogue, checked installs, safe unpacking, COSMIC config, undo) and the
# CLI end to end, over temporary homes; the network is stubbed and never reached.
[[check]]
name = "unit tests"
run = ["cargo", "test", "-q"]
cwd = "tools/pengyos-themes"
expect = "exit0"
timeout = 900
