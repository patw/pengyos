# The whole-repo gate: every tool's own tests (verify.toml: pytest / cargo test)
# plus the wiring lints and recipe source checks (scripts/pengyos_gate.py).
#
# Manual only since 2026-11-11 (Actions tab -> gate -> Run workflow). The same
# gate runs on the build box, where the images are built and verified: nightly
# (pengyos-nightly reports a red gate in its email) and before every publish
# (scripts/release.sh). Running it here on every push mostly tested GitHub's
# runner (AppArmor, missing headers, 2 vCPUs) and sent failure emails.
name: gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python test dependencies
        # flask is not optional either: pengyos-nightly's test_decisions_web.py does
        # `pytest.importorskip("flask")`, so without it 19 web tests are skipped as a
        # single 'skip' and the gate reports green over code it never ran
        # (287 tests in CI vs 306 on a dev box).
        run: python -m pip install pytest pyyaml cryptography flask

      # Disk-image tests use these when present and skip without them; the
      # QEMU/swtpm/OVMF integration tests are opt-in (PENGYOS_IT) and skip here.
      # zsh is NOT optional: test_server_comfort_shell parses the login-shell
      # profile with `zsh -n` and has no skipif, because a profile that zsh
      # cannot parse breaks every Server login shell. The runner image has no
      # zsh, so it must be installed here (it was missing 2026-10-12→14: the
      # suite failed with FileNotFoundError: 'zsh' on every push).
      #
      # nftables + the userns sysctl: pengyos-firewall checks the shipped ruleset
      # with the real `nft -c` inside `unshare -rn`. Ubuntu 24.04's AppArmor blocks
      # unprivileged user namespaces by default, so unshare failed and the suite
      # was red on every push from 11-08 (it skips only when nft/unshare are absent).
      #
      # libpipewire-0.3-dev, libclang-dev, pkg-config: pengyos-rdp-server's
      # `pipewire` crate binds libspa/libpipewire through bindgen + pkg-config, and
      # the runner image has neither the headers nor the .pc files.
      - name: Host tools for the image tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdisk dosfstools mtools zstd zsh \
            nftables libpipewire-0.3-dev libclang-dev pkg-config
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The Rust tools' default `cargo test` is std-only (libcosmic is behind an
      # off-by-default feature), so the runner's stable toolchain is enough.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/*/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/*/Cargo.lock') }}

      - name: Gate (full, whole repo)
        run: python scripts/pengyos_gate.py run --repo . --mode full --base none --junit gate-junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-junit
          path: gate-junit.xml
