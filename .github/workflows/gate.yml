# The repo gate on every push and pull request: every tool's own tests
# (verify.toml: pytest / cargo test) plus the wiring lints and recipe source
# checks that the unit suites cannot see (scripts/pengyos_gate.py). Image builds
# and QEMU boots stay on the build host: they need hours and KVM.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python test dependencies
        # flask is not optional either: pengyos-nightly's test_decisions_web.py does
        # `pytest.importorskip("flask")`, so without it 19 web tests are skipped as a
        # single 'skip' and the gate reports green over code it never ran
        # (287 tests in CI vs 306 on a dev box).
        run: python -m pip install pytest pyyaml cryptography flask

      # Disk-image tests use these when present and skip without them; the
      # QEMU/swtpm/OVMF integration tests are opt-in (PENGYOS_IT) and skip here.
      # zsh is NOT optional: test_server_comfort_shell parses the login-shell
      # profile with `zsh -n` and has no skipif, because a profile that zsh
      # cannot parse breaks every Server login shell. The runner image has no
      # zsh, so it must be installed here (it was missing 2026-10-12→14: the
      # suite failed with FileNotFoundError: 'zsh' on every push).
      - name: Host tools for the image tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdisk dosfstools mtools zstd zsh

      # The Rust tools' default `cargo test` is std-only (libcosmic is behind an
      # off-by-default feature), so the runner's stable toolchain is enough.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/*/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/*/Cargo.lock') }}

      - name: Gate (full, whole repo)
        run: python scripts/pengyos_gate.py run --repo . --mode full --base none --junit gate-junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-junit
          path: gate-junit.xml
